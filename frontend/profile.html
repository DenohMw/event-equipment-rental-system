<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>My Profile - EventEquip Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .profile-layout { display: grid; grid-template-columns: minmax(240px, .75fr) minmax(0, 1.5fr); gap: 24px; align-items: start; }
        .profile-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 24px; }
        .profile-photo-block { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .profile-photo { width: 132px; height: 132px; display: grid; place-items: center; overflow: hidden; border-radius: 50%; background: #1e3a8a; color: #fff; font-size: 38px; font-weight: 800; margin-bottom: 16px; }
        .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
        .profile-photo-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .profile-hint { color: #64748b; font-size: 12px; line-height: 1.5; margin-top: 12px; }
        .profile-section-title { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
        .profile-section-subtitle { margin: 0 0 20px; color: #64748b; font-size: 13px; }
        .profile-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .profile-form-grid .form-group { margin-bottom: 0; }
        .profile-form-grid .span-2 { grid-column: 1 / -1; }
        .profile-actions { display: flex; justify-content: flex-end; margin-top: 24px; }
        @media (max-width: 820px) { .profile-layout { grid-template-columns: 1fr; } }
        @media (max-width: 560px) { .profile-form-grid { grid-template-columns: 1fr; } .profile-form-grid .span-2 { grid-column: auto; } }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar"></aside>
    <main class="app-main">
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()" aria-label="Toggle navigation">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="topbar-search"><span style="font-weight: 700;">My Profile</span></div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" data-action="logout" title="Sign out" aria-label="Sign out">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta"><div class="topbar-user-name" data-user="name">Loading...</div><div class="topbar-user-role" data-user="role"></div></div>
                </div>
            </div>
        </div>
        <div class="app-content">
            <div class="page-header">
                <h1 class="page-title">My Profile</h1>
                <p class="page-subtitle">Manage your account details and profile photo.</p>
            </div>
            <div class="profile-layout">
                <section class="profile-card profile-photo-block">
                    <div class="profile-photo" id="profilePhotoPreview">?</div>
                    <div style="font-weight: 700;" id="profileDisplayName">Your profile</div>
                    <div style="font-size: 13px; color: #64748b; margin: 4px 0 16px;" id="profileDisplayRole"></div>
                    <input type="file" id="profilePhotoInput" accept="image/jpeg,image/png,image/webp" hidden>
                    <div class="profile-photo-actions">
                        <button type="button" class="btn btn-outline btn-sm" id="choosePhotoBtn">Update photo</button>
                        <button type="button" class="btn btn-outline btn-sm" id="removePhotoBtn" style="display: none;">Remove photo</button>
                    </div>
                    <div class="profile-hint">JPG, PNG, or WEBP. Maximum 5 MB.</div>
                </section>

                <section class="profile-card">
                    <h2 class="profile-section-title">Personal information</h2>
                    <p class="profile-section-subtitle">Keep your contact details current so people can reach you.</p>
                    <div class="alert" id="profileAlert" style="display: none; margin-bottom: 18px;"></div>
                    <form id="profileForm" novalidate>
                        <div class="profile-form-grid">
                            <div class="form-group">
                                <label class="form-label" for="fullName">Full name <span class="required">*</span></label>
                                <input class="form-input" id="fullName" name="full_name" autocomplete="name" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="email">Email address <span class="required">*</span></label>
                                <input class="form-input" id="email" name="email" type="email" autocomplete="email" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label" for="phone">Phone number <span class="required">*</span></label>
                                <input class="form-input" id="phone" name="phone" type="tel" autocomplete="tel" required>
                            </div>
                            <div class="form-group span-2" id="businessNameGroup" style="display: none;">
                                <label class="form-label" for="businessName">Business name <span class="required">*</span></label>
                                <input class="form-input" id="businessName" name="business_name" autocomplete="organization">
                            </div>
                        </div>
                        <div class="profile-actions">
                            <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save changes</button>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>
</div>
<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    const signedInUser = Auth.requireAuth();
    if (!signedInUser) throw new Error('Not authorized');
    Sidebar.render();
    UI.initShell();

    let profileUser = signedInUser;
    let selectedPhoto = null;
    let removeCurrentPhoto = false;
    let temporaryPhotoUrl = null;

    function renderProfilePhoto(photoUrl) {
        const preview = document.getElementById('profilePhotoPreview');
        const initials = Utils.initials(profileUser.full_name);
        preview.replaceChildren();
        if (photoUrl) {
            const img = document.createElement('img');
            img.src = Utils.imageUrl(photoUrl);
            img.alt = 'Profile photo';
            img.onerror = function () { preview.textContent = initials; };
            preview.appendChild(img);
        } else {
            preview.textContent = initials;
        }
        document.getElementById('profileDisplayName').textContent = profileUser.full_name || 'Your profile';
        document.getElementById('profileDisplayRole').textContent = profileUser.role || '';
        document.getElementById('removePhotoBtn').style.display = photoUrl ? '' : 'none';
    }

    async function loadProfile() {
        try {
            const result = await Api.getMe();
            profileUser = result.user;
            Storage.setUser(profileUser);
            UI.hydrateUser();
            document.getElementById('fullName').value = profileUser.full_name || '';
            document.getElementById('email').value = profileUser.email || '';
            document.getElementById('phone').value = profileUser.phone || '';
            if (profileUser.role === 'owner') {
                document.getElementById('businessNameGroup').style.display = '';
                document.getElementById('businessName').value = profileUser.business_name || '';
            }
            renderProfilePhoto(profileUser.profile_photo);
        } catch (err) {
            showProfileAlert(err.message || 'Could not load your profile.', 'danger');
        }
    }

    function showProfileAlert(message, type) {
        const alert = document.getElementById('profileAlert');
        alert.className = 'alert alert-' + type;
        alert.textContent = message;
        alert.style.display = 'flex';
    }

    document.getElementById('choosePhotoBtn').addEventListener('click', function () {
        document.getElementById('profilePhotoInput').click();
    });

    document.getElementById('profilePhotoInput').addEventListener('change', function () {
        const file = this.files && this.files[0];
        if (!file) return;
        if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
            UI.toast('Choose a JPG, PNG, or WEBP image.', 'warning');
            this.value = '';
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            UI.toast('Profile photos must be 5 MB or smaller.', 'warning');
            this.value = '';
            return;
        }
        selectedPhoto = file;
        removeCurrentPhoto = false;
        if (temporaryPhotoUrl) URL.revokeObjectURL(temporaryPhotoUrl);
        temporaryPhotoUrl = URL.createObjectURL(file);
        renderProfilePhoto(temporaryPhotoUrl);
    });

    document.getElementById('removePhotoBtn').addEventListener('click', function () {
        selectedPhoto = null;
        removeCurrentPhoto = true;
        if (temporaryPhotoUrl) URL.revokeObjectURL(temporaryPhotoUrl);
        temporaryPhotoUrl = null;
        document.getElementById('profilePhotoInput').value = '';
        renderProfilePhoto(null);
    });

    document.getElementById('profileForm').addEventListener('submit', async function (event) {
        event.preventDefault();
        const data = {
            full_name: document.getElementById('fullName').value.trim(),
            email: document.getElementById('email').value.trim(),
            phone: Utils.normalisePhone(document.getElementById('phone').value.trim())
        };
        if (profileUser.role === 'owner') data.business_name = document.getElementById('businessName').value.trim();
        if (data.full_name.length < 2) return showProfileAlert('Enter your full name.', 'warning');
        if (!/^\S+@\S+\.\S+$/.test(data.email)) return showProfileAlert('Enter a valid email address.', 'warning');
        if (!Utils.isValidKenyanPhone(data.phone)) return showProfileAlert('Enter a valid Kenyan phone number.', 'warning');
        if (profileUser.role === 'owner' && data.business_name.length < 2) return showProfileAlert('Enter your business name.', 'warning');

        const button = document.getElementById('saveProfileBtn');
        const restore = UI.buttonLoading(button, 'Saving profile...');
        try {
            const result = await Api.updateProfile(data, selectedPhoto, removeCurrentPhoto);
            profileUser = result.user;
            Storage.save(result.token, profileUser, Storage.isRemembered(profileUser.user_id));
            UI.hydrateUser();
            selectedPhoto = null;
            removeCurrentPhoto = false;
            if (temporaryPhotoUrl) URL.revokeObjectURL(temporaryPhotoUrl);
            temporaryPhotoUrl = null;
            document.getElementById('profilePhotoInput').value = '';
            renderProfilePhoto(profileUser.profile_photo);
            showProfileAlert('Your profile has been updated.', 'success');
        } catch (err) {
            showProfileAlert(err.message || 'Could not save your profile.', 'danger');
        } finally {
            restore();
        }
    });

    loadProfile();
</script>
    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
