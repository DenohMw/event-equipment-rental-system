<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Reset Password - EventEquip Kenya</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; }
        .auth-card { width: min(100%, 460px); padding: 36px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 18px 45px rgba(15,23,42,.08); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; color: #0f172a; font-weight: 800; text-decoration: none; }
        .brand img { width: 44px; height: 44px; border-radius: 10px; }
        .brand small { display: block; color: #64748b; font-size: 9px; letter-spacing: .16em; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        .subtitle { margin: 0 0 24px; color: #64748b; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 18px; }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>
    <main class="auth-card">
        <a href="/" class="brand"><img src="/assets/images/icons/Icon.png" alt=""><span>EventEquip<small>KENYA</small></span></a>
        <h1>Forgot your password?</h1>
        <p class="subtitle">Enter the phone number on your account. We’ll send a six-digit verification code if it matches an active account.</p>
        <div class="alert" id="resetStatus" style="display: none; margin-bottom: 18px;"></div>
        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="phone">Phone number</label>
                <input class="form-input" id="phone" type="tel" autocomplete="tel" required placeholder="0712 345 678">
            </div>
            <button class="btn btn-primary btn-block" id="sendResetBtn" type="submit">Send verification code</button>
        </form>
        <div style="margin-top: 22px; text-align: center; font-size: 13px;"><a href="/login.html">Back to sign in</a></div>
    </main>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script>
        const statusBox = document.getElementById('resetStatus');
        const submitButton = document.getElementById('sendResetBtn');
        function showStatus(message, type) {
            statusBox.className = 'alert alert-' + type;
            statusBox.textContent = message;
            statusBox.style.display = 'flex';
        }
        Api.getPasswordResetStatus().then(function (data) {
            if (!data.enabled) {
                submitButton.disabled = true;
                showStatus('Password recovery is temporarily unavailable. Please try again later.', 'warning');
            }
        }).catch(function () {
            submitButton.disabled = true;
            showStatus('Password reset is temporarily unavailable. Please try again later.', 'warning');
        });
        document.getElementById('forgotForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            if (!/^0?[17]\d{8}$/.test(phone.replace(/\D/g, '')) && !/^254[17]\d{8}$/.test(phone.replace(/\D/g, ''))) return showStatus('Enter a valid phone number.', 'danger');
            const restore = UI.buttonLoading(submitButton, 'Sending...');
            try {
                const result = await Api.requestPasswordReset(phone);
                showStatus(result.message, 'success');
                sessionStorage.setItem('eventequip_reset_phone', phone);
                window.location.href = '/verify-otp.html';
            } catch (err) {
                showStatus(err.message || 'Could not send the reset SMS. Please try again later.', 'danger');
            } finally {
                restore();
            }
        });
    </script>
    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
