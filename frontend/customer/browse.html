<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Equipment - EventRent Kenya</title>
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .filter-panel {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
        }
        .filter-row {
            display: grid;
            grid-template-columns: minmax(180px, 1.5fr) repeat(5, minmax(125px, 1fr)) auto;
            gap: 12px;
            align-items: end;
        }
        .filter-row .form-group {
            margin-bottom: 0;
        }
        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .results-count {
            font-size: 13.5px;
            color: var(--color-text-muted);
        }
        .results-count strong {
            color: var(--color-text);
            font-weight: 700;
        }
        .sort-select {
            padding: 8px 12px;
            font-size: 13px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            background: white;
            font-family: inherit;
            cursor: pointer;
            font-weight: 500;
        }
        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .equipment-card {
            background: white;
            border: 1px solid var(--color-border);
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }
        .equipment-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-color: transparent;
            text-decoration: none;
            color: inherit;
        }
        .equipment-media {
            position: relative;
            aspect-ratio: 4/3;
            background: var(--color-bg);
            overflow: hidden;
        }
        .equipment-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .equipment-card:hover .equipment-media img {
            transform: scale(1.05);
        }
        .equipment-media-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
        .equipment-media-placeholder svg {
            width: 60px;
            height: 60px;
            stroke-width: 1;
        }
        .equipment-category {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            background: var(--color-navy);
            color: white;
            font-size: 10.5px;
            font-weight: 700;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .equipment-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .equipment-title {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--color-text);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .equipment-price {
            font-size: 18px;
            font-weight: 700;
            color: var(--color-orange);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .equipment-price small {
            font-size: 12px;
            color: var(--color-text-muted);
            font-weight: 500;
        }
        .equipment-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--color-text-muted);
            padding-top: 10px;
            border-top: 1px solid var(--color-border);
            margin-top: auto;
        }
        .equipment-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 600;
            color: var(--color-text);
        }
        .equipment-rating svg {
            width: 13px;
            height: 13px;
            color: #F59E0B;
            fill: #F59E0B;
        }
        .equipment-location {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .equipment-location svg {
            width: 12px;
            height: 12px;
        }
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 16px 0;
            flex-wrap: wrap;
        }
        .pagination-btn {
            min-width: 36px;
            height: 36px;
            padding: 0 12px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--color-text);
            border: 1px solid var(--color-border);
            background: white;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }
        .pagination-btn:hover:not(:disabled) {
            border-color: var(--color-navy);
            color: var(--color-navy);
        }
        .pagination-btn.active {
            background: var(--color-navy);
            border-color: var(--color-navy);
            color: white;
        }
        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .pagination-info {
            font-size: 13px;
            color: var(--color-text-muted);
            margin-left: 12px;
        }
        @media (max-width: 1024px) {
            .filter-row {
                grid-template-columns: 1fr 1fr;
            }
            .filter-row .btn {
                grid-column: 1 / -1;
            }
        }
        @media (max-width: 600px) {
            .filter-row {
                grid-template-columns: 1fr;
            }
            .equipment-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            .equipment-title {
                font-size: 13.5px;
            }
            .equipment-price {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

<div class="app-shell">

    <!-- SIDEBAR (rendered by sidebar.js) -->
    <aside class="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main class="app-main">

        <!-- TOPBAR -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search equipment..." autocomplete="off">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" onclick="window.location.href='/customer/chat.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a8 8 0 11-3.5 6.6L3 21l2.4-6.5A8 8 0 0121 12z"/>
                    </svg>
                    <span class="topbar-icon-badge" id="chatBadge" style="display: none;">0</span>
                </button>
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="app-content">

            <div class="page-header">
                <h1 class="page-title">Browse Equipment</h1>
                <p class="page-subtitle">Find the perfect equipment for your event across Kenya</p>
            </div>

            <!-- FILTER PANEL -->
            <div class="filter-panel">
                <div class="filter-row">
                    <div class="form-group">
                        <label class="form-label">Search</label>
                        <input type="text" id="searchInput" class="form-input" placeholder="Search by name or description">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="categorySelect" class="form-select">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="regionSelect">Region</label>
                        <select id="regionSelect" class="form-select"><option value="">All regions</option></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="countySelect">County</label>
                        <select id="countySelect" class="form-select" disabled><option value="">Choose a region first</option></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="locationSelect">Town</label>
                        <select id="locationSelect" class="form-select" disabled><option value="">Choose a county first</option></select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Max Price (KSh)</label>
                        <input type="number" id="maxPriceInput" class="form-input" placeholder="e.g. 5000" min="0">
                    </div>
                    <button class="btn btn-primary" id="applyFiltersBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="7"/>
                            <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                        </svg>
                        Apply Filters
                    </button>
                </div>
            </div>

            <!-- RESULTS HEADER -->
            <div class="results-header">
                <div class="results-count" id="resultsCount">Loading equipment...</div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="font-size: 13px; color: var(--color-text-muted);">Sort by:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="newest">Newest First</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                        <option value="rating">Highest Rated</option>
                        <option value="popular">Most Popular</option>
                    </select>
                </div>
            </div>

            <!-- EQUIPMENT GRID -->
            <div class="equipment-grid" id="equipmentGrid"></div>

            <!-- PAGINATION -->
            <div class="pagination" id="pagination"></div>

        </div>
    </main>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    // Browsing is public; protected actions still send customers through sign in.
    const user = Storage.getUser();
    UI.initPublicShell();
    if (user && user.role === 'customer') Sidebar.updateUnreadBadge();

    // State
    const state = {
        page: 1,
        limit: 12,
        search: '',
        category: '',
        location: '',
        region: '',
        county: '',
        max_price: '',
        sort: 'newest',
        totalPages: 0,
        totalItems: 0
    };

    // Read URL params on load
    (function initializeFromURL() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('search')) state.search = params.get('search');
        if (params.get('category')) state.category = params.get('category');
        if (params.get('location')) state.location = params.get('location');
        if (params.get('region')) state.region = params.get('region');
        if (params.get('county')) state.county = params.get('county');
        if (params.get('max_price')) state.max_price = params.get('max_price');
        if (params.get('sort')) state.sort = params.get('sort');
        if (params.get('page')) state.page = parseInt(params.get('page'), 10) || 1;

        document.getElementById('searchInput').value = state.search;
        document.getElementById('maxPriceInput').value = state.max_price;
        document.getElementById('sortSelect').value = state.sort;
        document.getElementById('topSearch').value = state.search;
    })();

    // ============================================
    // Load categories into dropdown
    // ============================================
    async function loadCategories() {
        try {
            const data = await Api.getCategories();
            const select = document.getElementById('categorySelect');
            (data.categories || []).forEach(function (cat) {
                const option = document.createElement('option');
                option.value = cat.name;
                option.textContent = cat.name;
                if (cat.name === state.category) option.selected = true;
                select.appendChild(option);
            });
        } catch (err) {
            console.error('Failed to load categories:', err);
        }
    }

    // Load and progressively filter the location catalog: region → county → town.
    let locationCatalog = [];

    function replaceOptions(select, placeholder, values, getValue, getLabel) {
        select.replaceChildren(new Option(placeholder, ''));
        values.forEach(function (item) {
            select.add(new Option(getLabel(item), getValue(item)));
        });
    }

    function refreshCounties(selectedCounty) {
        const region = document.getElementById('regionSelect').value;
        const countySelect = document.getElementById('countySelect');
        const counties = Array.from(new Set(locationCatalog
            .filter(function (item) { return !region || item.region === region; })
            .map(function (item) { return item.county; })))
            .sort();
        replaceOptions(countySelect, region ? 'All counties' : 'Choose a region first', counties,
            function (county) { return county; }, function (county) { return county; });
        countySelect.disabled = !region;
        countySelect.value = selectedCounty || '';
        refreshTowns(state.location);
    }

    function refreshTowns(selectedTown) {
        const region = document.getElementById('regionSelect').value;
        const county = document.getElementById('countySelect').value;
        const townSelect = document.getElementById('locationSelect');
        const towns = locationCatalog.filter(function (item) {
            return (!region || item.region === region) && (!county || item.county === county);
        }).sort(function (a, b) { return a.name.localeCompare(b.name); });
        replaceOptions(townSelect, county ? 'All towns' : (region ? 'Choose a county' : 'Choose a county first'), towns,
            function (town) { return town.name; }, function (town) { return town.name; });
        townSelect.disabled = !county;
        townSelect.value = selectedTown || '';
    }

    async function loadLocations() {
        try {
            const data = await Api.getLocations();
            locationCatalog = data.locations || [];
            const regions = Array.from(new Set(locationCatalog.map(function (item) { return item.region; }))).sort();
            replaceOptions(document.getElementById('regionSelect'), 'All regions', regions,
                function (region) { return region; }, function (region) { return region; });

            const selectedTown = locationCatalog.find(function (item) { return item.name === state.location; });
            const selectedCounty = locationCatalog.find(function (item) { return item.county === state.county; });
            if (selectedCounty) state.region = state.region || selectedCounty.region;
            if (selectedTown) {
                state.region = state.region || selectedTown.region;
                state.county = state.county || selectedTown.county;
            }
            document.getElementById('regionSelect').value = state.region;
            refreshCounties(state.county);
            refreshTowns(state.location);
            console.log('Loaded ' + data.total + ' locations across ' + regions.length + ' regions');
        } catch (err) {
            console.error('Failed to load locations:', err);
        }
    }

    // ============================================
    // Load equipment
    // ============================================
    async function loadEquipment() {
        const grid = document.getElementById('equipmentGrid');
        const resultsCount = document.getElementById('resultsCount');

        UI.skeletonCards(grid, state.limit);
        resultsCount.textContent = 'Loading equipment...';

        try {
            const filters = {
                page: state.page,
                limit: state.limit,
                sort: state.sort
            };
            if (state.search) filters.search = state.search;
            if (state.category) filters.category = state.category;
            if (state.location) filters.location = state.location;
            if (state.region) filters.region = state.region;
            if (state.county) filters.county = state.county;
            if (state.max_price) filters.max_price = state.max_price;

            const data = await Api.getEquipment(filters);
            const items = data.equipment || [];

            state.totalPages = data.pages || 0;
            state.totalItems = data.total || 0;

            resultsCount.innerHTML = 'Showing <strong>' + items.length + '</strong> of <strong>' +
                state.totalItems + '</strong> items';

            renderEquipment(items);
            renderPagination();
            updateURL();

        } catch (err) {
            console.error('Failed to load equipment:', err);
            UI.emptyState(
                grid,
                'Failed to load equipment',
                err.message || 'Please try again.'
            );
            resultsCount.textContent = '';
            document.getElementById('pagination').innerHTML = '';
        }
    }

    // ============================================
    // Render equipment cards
    // ============================================
    function renderEquipment(items) {
        const grid = document.getElementById('equipmentGrid');

        if (items.length === 0) {
            UI.emptyState(
                grid,
                'No equipment found',
                'Try adjusting your filters or search terms.',
                '<button class="btn btn-outline" onclick="resetFilters()">Reset Filters</button>'
            );
            return;
        }

        grid.innerHTML = items.map(function (item) {
            const imagePath = item.primary_image || '';
            const imageUrl = imagePath ? CONFIG.API_BASE_URL + imagePath : '';

            const imageHtml = imageUrl
                ? '<img src="' + Utils.escapeHtml(imageUrl) + '" alt="' +
                    Utils.escapeHtml(item.name) + '" loading="lazy" onerror="this.style.display=\'none\'">'
                : '<div class="equipment-media-placeholder">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                        '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3l9 7-2 11H5L3 10l9-7z"/>' +
                    '</svg>' +
                '</div>';

            const rating = Number(item.avg_rating || 0).toFixed(1);
            const reviewCount = item.total_reviews || 0;

            return '<a href="/customer/equipment.html?id=' + item.equipment_id + '" class="equipment-card">' +
                '<div class="equipment-media">' +
                    imageHtml +
                    '<span class="equipment-category">' + Utils.escapeHtml(item.category_name || '') + '</span>' +
                '</div>' +
                '<div class="equipment-body">' +
                    '<div class="equipment-title">' + Utils.escapeHtml(item.name) + '</div>' +
                    '<div class="equipment-price">' +
                        Utils.formatCurrency(item.price_per_day) +
                        '<small>per day</small>' +
                    '</div>' +
                    '<div class="equipment-meta">' +
                        '<div class="equipment-rating">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">' +
                                '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>' +
                            '</svg>' +
                            rating +
                            ' <span style="color: #94a3b8; font-weight: 400;">(' + reviewCount + ')</span>' +
                        '</div>' +
                        '<div class="equipment-location">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">' +
                                '<path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>' +
                                '<circle cx="12" cy="11" r="3"/>' +
                            '</svg>' +
                            Utils.escapeHtml(item.location || '') +
                        '</div>' +
                    '</div>' +
                '</div>' +
            '</a>';
        }).join('');
    }

    // ============================================
    // Render pagination
    // ============================================
    function renderPagination() {
        const container = document.getElementById('pagination');

        if (state.totalPages <= 1) {
            container.innerHTML = '';
            return;
        }

        let html = '';

        html += '<button class="pagination-btn" ' +
            (state.page === 1 ? 'disabled' : '') +
            ' onclick="goToPage(' + (state.page - 1) + ')">Previous</button>';

        const startPage = Math.max(1, state.page - 2);
        const endPage = Math.min(state.totalPages, state.page + 2);

        if (startPage > 1) {
            html += '<button class="pagination-btn" onclick="goToPage(1)">1</button>';
            if (startPage > 2) html += '<span style="padding: 0 8px; color: #64748B;">...</span>';
        }

        for (let i = startPage; i <= endPage; i++) {
            html += '<button class="pagination-btn ' + (i === state.page ? 'active' : '') +
                '" onclick="goToPage(' + i + ')">' + i + '</button>';
        }

        if (endPage < state.totalPages) {
            if (endPage < state.totalPages - 1) html += '<span style="padding: 0 8px; color: #64748B;">...</span>';
            html += '<button class="pagination-btn" onclick="goToPage(' + state.totalPages + ')">' +
                state.totalPages + '</button>';
        }

        html += '<button class="pagination-btn" ' +
            (state.page === state.totalPages ? 'disabled' : '') +
            ' onclick="goToPage(' + (state.page + 1) + ')">Next</button>';

        html += '<span class="pagination-info">Page ' + state.page + ' of ' + state.totalPages + '</span>';

        container.innerHTML = html;
    }

    // Navigate to page
    function goToPage(page) {
        if (page < 1 || page > state.totalPages || page === state.page) return;
        state.page = page;
        loadEquipment();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Update URL with current filters
    function updateURL() {
        const params = new URLSearchParams();
        if (state.search) params.set('search', state.search);
        if (state.category) params.set('category', state.category);
        if (state.location) params.set('location', state.location);
        if (state.region) params.set('region', state.region);
        if (state.county) params.set('county', state.county);
        if (state.max_price) params.set('max_price', state.max_price);
        if (state.sort !== 'newest') params.set('sort', state.sort);
        if (state.page > 1) params.set('page', state.page);

        const newURL = window.location.pathname + (params.toString() ? '?' + params.toString() : '');
        window.history.replaceState({}, '', newURL);
    }

    // Reset filters
    function resetFilters() {
        state.search = '';
        state.category = '';
        state.location = '';
        state.region = '';
        state.county = '';
        state.max_price = '';
        state.sort = 'newest';
        state.page = 1;

        document.getElementById('searchInput').value = '';
        document.getElementById('categorySelect').value = '';
        document.getElementById('regionSelect').value = '';
        refreshCounties('');
        document.getElementById('maxPriceInput').value = '';
        document.getElementById('sortSelect').value = 'newest';
        document.getElementById('topSearch').value = '';

        loadEquipment();
    }

    // Wire filter controls
    document.getElementById('applyFiltersBtn').addEventListener('click', function () {
        state.search = document.getElementById('searchInput').value.trim();
        state.category = document.getElementById('categorySelect').value;
        state.location = document.getElementById('locationSelect').value;
        state.region = document.getElementById('regionSelect').value;
        state.county = document.getElementById('countySelect').value;
        state.max_price = document.getElementById('maxPriceInput').value;
        state.sort = document.getElementById('sortSelect').value;
        state.page = 1;
        loadEquipment();
    });

    document.getElementById('regionSelect').addEventListener('change', function () {
        state.region = this.value;
        state.county = '';
        state.location = '';
        refreshCounties('');
        document.getElementById('applyFiltersBtn').click();
    });
    document.getElementById('countySelect').addEventListener('change', function () {
        state.county = this.value;
        state.location = '';
        refreshTowns('');
        document.getElementById('applyFiltersBtn').click();
    });
    document.getElementById('locationSelect').addEventListener('change', function () {
        state.location = this.value;
        document.getElementById('applyFiltersBtn').click();
    });

    document.getElementById('sortSelect').addEventListener('change', function (e) {
        state.sort = e.target.value;
        state.page = 1;
        loadEquipment();
    });

    document.getElementById('searchInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            document.getElementById('applyFiltersBtn').click();
        }
    });

    document.getElementById('topSearch').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const q = e.target.value.trim();
            state.search = q;
            state.page = 1;
            document.getElementById('searchInput').value = q;
            loadEquipment();
        }
    });

    // Boot
    async function init() {
        await Promise.all([
            loadCategories(),
            loadLocations()
        ]);
        await loadEquipment();
    }

    init();
</script>

    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
