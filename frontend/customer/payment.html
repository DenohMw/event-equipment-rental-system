<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Complete Payment - EventEquip Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .payment-shell {
            max-width: 640px;
            margin: 0 auto;
        }

        .payment-progress {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            padding: 0 16px;
        }
        .progress-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            flex: 1;
            position: relative;
        }
        .progress-step:not(:last-child)::after {
            content: '';
            position: absolute;
            top: 16px;
            left: calc(50% + 20px);
            right: calc(-50% + 20px);
            height: 2px;
            background: #e2e8f0;
        }
        .progress-step.completed:not(:last-child)::after {
            background: #10B981;
        }
        .progress-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            position: relative;
            z-index: 1;
        }
        .progress-step.active .progress-icon {
            background: #F97316;
            color: white;
        }
        .progress-step.completed .progress-icon {
            background: #10B981;
            color: white;
        }
        .progress-label {
            font-size: 11px;
            font-weight: 600;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .progress-step.active .progress-label {
            color: #F97316;
        }
        .progress-step.completed .progress-label {
            color: #10B981;
        }

        .payment-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 32px;
            margin-bottom: 20px;
        }

        /* Booking summary at top */
        .payment-summary {
            display: flex;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }
        .payment-summary-thumb {
            width: 72px;
            height: 72px;
            border-radius: 10px;
            background: #F8FAFC;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
        .payment-summary-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .payment-summary-thumb svg {
            width: 32px;
            height: 32px;
            stroke-width: 1.5;
        }
        .payment-summary-info {
            flex: 1;
            min-width: 0;
        }
        .payment-summary-ref {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #F97316;
            margin-bottom: 4px;
        }
        .payment-summary-title {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .payment-summary-meta {
            font-size: 13px;
            color: #64748B;
        }

        .amount-due {
            background: #F8FAFC;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 28px;
        }
        .amount-due-label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #64748B;
            margin-bottom: 8px;
        }
        .amount-due-value {
            font-size: 36px;
            font-weight: 800;
            color: #F97316;
            line-height: 1;
            letter-spacing: -0.02em;
        }

        /* Phone input */
        .phone-input-wrapper {
            display: flex;
            align-items: stretch;
            margin-bottom: 20px;
        }
        .phone-prefix {
            padding: 14px 16px;
            background: #F8FAFC;
            border: 1.5px solid #e2e8f0;
            border-right: none;
            border-radius: 8px 0 0 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
        }
        .phone-prefix-flag {
            font-size: 16px;
        }
        .phone-input {
            flex: 1;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 0 8px 8px 0;
            font-size: 15px;
            font-family: inherit;
            font-weight: 500;
        }
        .phone-input:focus {
            outline: none;
            border-color: #1E3A8A;
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.08);
        }
        .phone-input:disabled {
            background: #F8FAFC;
            cursor: not-allowed;
        }

        /* Waiting state */
        .waiting-state {
            text-align: center;
            padding: 32px 20px;
        }
        .waiting-spinner {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            position: relative;
        }
        .waiting-spinner::before,
        .waiting-spinner::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 4px solid transparent;
        }
        .waiting-spinner::before {
            border-color: #dbeafe;
            border-top-color: #1E3A8A;
            animation: spin 1s linear infinite;
        }
        .waiting-spinner::after {
            inset: 8px;
            border-color: #fed7aa;
            border-bottom-color: #F97316;
            animation: spin 1.5s linear infinite reverse;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .waiting-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #0F172A;
        }
        .waiting-message {
            font-size: 14px;
            color: #64748B;
            line-height: 1.6;
            max-width: 380px;
            margin: 0 auto;
        }
        .waiting-help {
            margin-top: 24px;
            padding: 16px;
            background: #FEF3C7;
            border-radius: 8px;
            font-size: 13px;
            color: #92400e;
            line-height: 1.6;
            text-align: left;
        }
        .waiting-help strong {
            display: block;
            margin-bottom: 6px;
        }

        /* Success state */
        .success-state,
        .failed-state {
            text-align: center;
            padding: 32px 20px;
        }
        .state-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .state-icon.success {
            background: #d1fae5;
            color: #10B981;
        }
        .state-icon.failed {
            background: #fee2e2;
            color: #EF4444;
        }
        .state-icon svg {
            width: 40px;
            height: 40px;
            stroke-width: 2.5;
        }
        .state-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .state-title.success {
            color: #065f46;
        }
        .state-title.failed {
            color: #991b1b;
        }
        .state-message {
            font-size: 14px;
            color: #64748B;
            line-height: 1.6;
            max-width: 400px;
            margin: 0 auto 24px;
        }
        .state-details {
            background: #F8FAFC;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            text-align: left;
        }
        .state-detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
        }
        .state-detail-label {
            color: #64748B;
        }
        .state-detail-value {
            font-weight: 600;
            color: #0F172A;
            font-family: 'SF Mono', Menlo, monospace;
            font-size: 12.5px;
        }
        .state-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Trust footer */
        .trust-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 12.5px;
            color: #64748B;
            padding: 16px;
        }
        .trust-footer svg {
            width: 16px;
            height: 16px;
            color: #10B981;
            stroke-width: 2.5;
        }

        @media (max-width: 600px) {
            .payment-card {
                padding: 24px 20px;
            }
            .amount-due-value {
                font-size: 28px;
            }
            .progress-label {
                display: none;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main class="app-main">

        <!-- TOPBAR -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search equipment...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="app-content">
            <div class="payment-shell" id="paymentShell">
                <div class="loading-state" style="text-align: center; padding: 60px 20px; color: #64748B;">
                    <div class="spinner spinner-dark" style="width: 32px; height: 32px; border-width: 3px; display: inline-block;"></div>
                    <p style="margin-top: 16px;">Loading payment details...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    // Require customer
    const user = Auth.requireAuth('customer');
    if (!user) throw new Error('Not authorized');

    Sidebar.render();
    UI.initShell();

    // State
    const bookingId = Utils.getQueryParam('booking');
    let booking = null;
    let paymentState = 'form';  // form | waiting | success | failed
    let pollTimer = null;
    let pollCount = 0;
    const MAX_POLLS = 30; // 30 polls * 3s = 90 seconds

    // Init
    async function init() {
        if (!bookingId) {
            renderError('Booking not specified', 'No booking ID was provided. Start by creating a booking.');
            return;
        }

        try {
            const data = await Api.getBookingById(bookingId);
            booking = data.booking;

            // Validate state
            if (booking.status === 'paid') {
                renderSuccess(booking.mpesa_receipt || 'Already paid');
                return;
            }

            if (booking.status !== 'confirmed') {
                renderError(
                    'Booking not ready for payment',
                    'This booking is currently "' + booking.status + '". Payment can only be made on confirmed bookings.'
                );
                return;
            }

            renderPaymentForm();

        } catch (err) {
            console.error('Failed to load booking:', err);
            renderError('Failed to load booking', err.message);
        }
    }

    // Render the payment form
    function renderPaymentForm() {
        const imageUrl = booking.equipment_image || '';
        const imageHtml = imageUrl
            ? '<img src="' + Utils.escapeHtml(imageUrl) + '" alt="">'
            : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3l9 7-2 11H5L3 10l9-7z"/>' +
              '</svg>';

        const html =
            renderProgress(2) +

            '<div class="payment-card">' +
                '<div class="payment-summary">' +
                    '<div class="payment-summary-thumb">' + imageHtml + '</div>' +
                    '<div class="payment-summary-info">' +
                        '<div class="payment-summary-ref">' + Utils.escapeHtml(booking.booking_ref) + '</div>' +
                        '<div class="payment-summary-title">' + Utils.escapeHtml(booking.equipment_name) + '</div>' +
                        '<div class="payment-summary-meta">' +
                            booking.quantity + ' units &middot; ' +
                            Utils.formatDate(booking.start_date) + ' to ' + Utils.formatDate(booking.end_date) +
                        '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="amount-due">' +
                    '<div class="amount-due-label">Amount Due</div>' +
                    '<div class="amount-due-value">' + Utils.formatCurrency(booking.total_amount) + '</div>' +
                '</div>' +

                '<div style="margin-bottom: 12px;">' +
                    '<label style="font-size: 13px; font-weight: 600; color: #0F172A;">M-Pesa Phone Number</label>' +
                    '<div style="font-size: 12.5px; color: #64748B; margin-top: 4px; margin-bottom: 12px;">' +
                        'You will receive an STK Push prompt on this number' +
                    '</div>' +
                '</div>' +

                '<div class="phone-input-wrapper">' +
                    '<div class="phone-prefix">' +
                        '<span class="phone-prefix-flag">&#127472;&#127466;</span>' +
                        '+254' +
                    '</div>' +
                    '<input type="tel" class="phone-input" id="phoneInput" ' +
                        'placeholder="712 345 678" maxlength="9" value="' + getInitialPhone() + '">' +
                '</div>' +

                '<button class="btn btn-primary btn-block btn-lg" id="payBtn">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">' +
                        '<rect x="5" y="2" width="14" height="20" rx="2"/>' +
                        '<path d="M12 18h.01"/>' +
                    '</svg>' +
                    'Pay ' + Utils.formatCurrency(booking.total_amount) + ' with M-Pesa' +
                '</button>' +

                '<div class="trust-footer">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                        '<path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/>' +
                        '<path stroke-linecap="round" d="M9 12l2 2 4-4"/>' +
                    '</svg>' +
                    'Secured by Safaricom M-Pesa. Your payment is encrypted.' +
                '</div>' +
            '</div>' +

            '<div style="text-align: center; margin-top: 20px;">' +
                '<a href="/customer/bookings.html" style="font-size: 13px; color: #64748B;">' +
                    'Cancel and return to my bookings' +
                '</a>' +
            '</div>';

        document.getElementById('paymentShell').innerHTML = html;
        document.getElementById('payBtn').addEventListener('click', initiatePayment);

        // Auto-format the phone number
        document.getElementById('phoneInput').addEventListener('input', function (e) {
            this.value = this.value.replace(/\D/g, '').slice(0, 9);
        });
    }

    function getInitialPhone() {
        // Try to extract from user record
        const raw = (user.phone || '').replace(/\D/g, '');
        if (raw.startsWith('254')) return raw.slice(3);
        if (raw.startsWith('0')) return raw.slice(1);
        return raw.slice(-9);
    }

    // Initiate STK Push
    async function initiatePayment() {
        const phoneInput = document.getElementById('phoneInput');
        const phone = phoneInput.value.replace(/\D/g, '');
        const payBtn = document.getElementById('payBtn');

        if (phone.length !== 9) {
            UI.toast('Please enter a valid 9-digit phone number', 'warning');
            return;
        }

        const fullPhone = '254' + phone;

        const restore = UI.buttonLoading(payBtn, 'Initiating payment...');

        try {
            const result = await Api.initiatePayment({
                booking_id: booking.booking_id,
                phone: fullPhone
            });

            // Switch to waiting state
            paymentState = 'waiting';
            pollCount = 0;
            renderWaiting(result.checkout_request_id);

            // Start polling
            startPolling();

        } catch (err) {
            console.error('Payment initiation failed:', err);
            UI.toast(err.message || 'Failed to initiate payment', 'error');
            restore();
        }
    }

    // Poll payment status
    function startPolling() {
        pollTimer = setInterval(async function () {
            pollCount++;

            if (pollCount > MAX_POLLS) {
                clearInterval(pollTimer);
                renderFailed('Request timed out. Please try again.');
                return;
            }

            try {
                const data = await Api.getPaymentStatus(booking.booking_id);
                const payment = data.payment;

                if (!payment) return;

                if (payment.status === 'completed') {
                    clearInterval(pollTimer);
                    renderSuccess(payment.mpesa_receipt);
                } else if (payment.status === 'failed') {
                    clearInterval(pollTimer);
                    renderFailed('Payment was cancelled or failed.');
                }
                // else: still pending, continue polling

            } catch (err) {
                // Silent failure, keep polling
                console.warn('Poll error:', err.message);
            }
        }, 3000); // every 3 seconds
    }

    // Render waiting screen
    function renderWaiting(checkoutRequestId) {
        const html =
            renderProgress(3) +

            '<div class="payment-card">' +
                '<div class="waiting-state">' +
                    '<div class="waiting-spinner"></div>' +
                    '<div class="waiting-title">Waiting for M-Pesa confirmation</div>' +
                    '<div class="waiting-message">' +
                        'An M-Pesa prompt has been sent to <strong>+254 ' +
                        Utils.escapeHtml(document.getElementById('phoneInput') ? document.getElementById('phoneInput').value : '') +
                        '</strong>. Enter your M-Pesa PIN to complete the payment.' +
                    '</div>' +

                    '<div class="waiting-help">' +
                        '<strong>Do not close this page.</strong>' +
                        'This page will update automatically when the payment is confirmed. ' +
                        'If you do not see the M-Pesa prompt, check your phone signal and try again.' +
                    '</div>' +
                '</div>' +
            '</div>';

        document.getElementById('paymentShell').innerHTML = html;
    }

    // Render success
    function renderSuccess(receipt) {
        paymentState = 'success';

        const html =
            renderProgress(4) +

            '<div class="payment-card">' +
                '<div class="success-state">' +
                    '<div class="state-icon success">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                            '<path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>' +
                        '</svg>' +
                    '</div>' +
                    '<div class="state-title success">Payment Successful</div>' +
                    '<div class="state-message">' +
                        'Your booking has been confirmed and the owner has been notified. ' +
                        'You will receive your equipment on the scheduled dates.' +
                    '</div>' +

                    '<div class="state-details">' +
                        '<div class="state-detail-row">' +
                            '<span class="state-detail-label">Booking Ref</span>' +
                            '<span class="state-detail-value">' + Utils.escapeHtml(booking.booking_ref) + '</span>' +
                        '</div>' +
                        '<div class="state-detail-row">' +
                            '<span class="state-detail-label">Amount Paid</span>' +
                            '<span class="state-detail-value">' + Utils.formatCurrency(booking.total_amount) + '</span>' +
                        '</div>' +
                        '<div class="state-detail-row">' +
                            '<span class="state-detail-label">M-Pesa Receipt</span>' +
                            '<span class="state-detail-value">' + Utils.escapeHtml(receipt) + '</span>' +
                        '</div>' +
                    '</div>' +

                    '<div class="state-actions">' +
                        '<a href="/customer/bookings.html" class="btn btn-primary">View My Bookings</a>' +
                        '<a href="/customer/browse.html" class="btn btn-outline">Continue Shopping</a>' +
                    '</div>' +
                '</div>' +
            '</div>';

        document.getElementById('paymentShell').innerHTML = html;
    }

    // Render failure
    function renderFailed(reason) {
        paymentState = 'failed';

        const html =
            renderProgress(3) +

            '<div class="payment-card">' +
                '<div class="failed-state">' +
                    '<div class="state-icon failed">' +
                        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                            '<path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>' +
                        '</svg>' +
                    '</div>' +
                    '<div class="state-title failed">Payment Failed</div>' +
                    '<div class="state-message">' + Utils.escapeHtml(reason) + '</div>' +

                    '<div class="state-actions">' +
                        '<button class="btn btn-primary" onclick="window.location.reload()">Try Again</button>' +
                        '<a href="/customer/bookings.html" class="btn btn-outline">View My Bookings</a>' +
                    '</div>' +
                '</div>' +
            '</div>';

        document.getElementById('paymentShell').innerHTML = html;
    }

    // Render error
    function renderError(title, message) {
        const html =
            '<div class="payment-card">' +
                '<div class="empty-state">' +
                    '<div class="empty-state-title">' + Utils.escapeHtml(title) + '</div>' +
                    '<div class="empty-state-message">' + Utils.escapeHtml(message) + '</div>' +
                    '<a href="/customer/bookings.html" class="btn btn-primary">Back to My Bookings</a>' +
                '</div>' +
            '</div>';

        document.getElementById('paymentShell').innerHTML = html;
    }

    // Progress indicator
    function renderProgress(activeStep) {
        const steps = [
            { label: 'Booking' },
            { label: 'Confirm' },
            { label: 'Payment' },
            { label: 'Complete' }
        ];

        return '<div class="payment-progress">' +
            steps.map(function (step, index) {
                const stepNum = index + 1;
                let classes = 'progress-step';
                if (stepNum < activeStep) classes += ' completed';
                if (stepNum === activeStep) classes += ' active';

                return '<div class="' + classes + '">' +
                    '<div class="progress-icon">' +
                        (stepNum < activeStep
                            ? '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>'
                            : stepNum
                        ) +
                    '</div>' +
                    '<div class="progress-label">' + step.label + '</div>' +
                '</div>';
            }).join('') +
        '</div>';
    }

    // Topbar search
    document.getElementById('topSearch').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const q = e.target.value.trim();
            if (q) window.location.href = '/customer/browse.html?search=' + encodeURIComponent(q);
        }
    });

    // Stop polling when leaving page
    window.addEventListener('beforeunload', function () {
        if (pollTimer) clearInterval(pollTimer);
    });

    init();
</script>

    <script defer src="/assets/js/motion.js"></script>
</body>
