<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Messages - EventEquip Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .chat-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 0;
            height: calc(100vh - 64px - 64px);
            min-height: 500px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
        }

        /* LEFT: conversations list */
        .conversations-panel {
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            background: white;
            overflow: hidden;
        }
        .conversations-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
        }
        .conversations-header-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .conversations-search {
            position: relative;
        }
        .conversations-search input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #F8FAFC;
            font-size: 13px;
            font-family: inherit;
        }
        .conversations-search input:focus {
            outline: none;
            border-color: #1E3A8A;
            background: white;
        }
        .conversations-search svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: #64748B;
            pointer-events: none;
            stroke-width: 2;
        }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }
        .conversation-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid #F1F5F9;
            cursor: pointer;
            transition: background 0.15s ease;
            border-left: 3px solid transparent;
        }
        .conversation-item:hover {
            background: #F8FAFC;
        }
        .conversation-item.active {
            background: #eff6ff;
            border-left-color: #1E3A8A;
        }
        .conversation-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #1E3A8A;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
            position: relative;
        }
        .conversation-avatar.online::after {
            content: '';
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10B981;
            border: 2px solid white;
        }
        .conversation-body {
            flex: 1;
            min-width: 0;
        }
        .conversation-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 2px;
        }
        .conversation-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #0F172A;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .conversation-time {
            font-size: 11px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .conversation-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .conversation-preview {
            font-size: 12.5px;
            color: #64748B;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .conversation-preview.unread {
            color: #0F172A;
            font-weight: 600;
        }
        .conversation-unread {
            min-width: 18px;
            height: 18px;
            padding: 0 5px;
            background: #F97316;
            color: white;
            font-size: 10px;
            font-weight: 700;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* RIGHT: chat area */
        .chat-panel {
            display: flex;
            flex-direction: column;
            background: #F8FAFC;
            overflow: hidden;
        }
        .chat-header {
            padding: 16px 20px;
            background: white;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1E3A8A;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .chat-header-info {
            flex: 1;
            min-width: 0;
        }
        .chat-header-name {
            font-size: 14.5px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 2px;
        }
        .chat-header-status {
            font-size: 12px;
            color: #64748B;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chat-header-status.online {
            color: #10B981;
            font-weight: 600;
        }
        .chat-header-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message-row {
            display: flex;
            gap: 8px;
            max-width: 70%;
        }
        .message-row.sent {
            margin-left: auto;
            flex-direction: row-reverse;
        }
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748B;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            align-self: flex-end;
        }
        .message-row.sent .message-avatar {
            background: #1E3A8A;
            color: white;
        }
        .message-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
        }
        .message-row.received .message-bubble {
            background: white;
            color: #0F172A;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 4px;
        }
        .message-row.sent .message-bubble {
            background: #1E3A8A;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message-time {
            font-size: 10.5px;
            margin-top: 4px;
            opacity: 0.7;
        }

        .chat-input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }
        .chat-input {
            width: 100%;
            min-height: 44px;
            max-height: 120px;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 22px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            line-height: 1.4;
            transition: all 0.15s ease;
        }
        .chat-input:focus {
            outline: none;
            border-color: #1E3A8A;
        }
        .chat-send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #F97316;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }
        .chat-send-btn:hover:not(:disabled) {
            background: #ea580c;
            transform: scale(1.05);
        }
        .chat-send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .chat-send-btn svg {
            width: 20px;
            height: 20px;
            stroke-width: 2.5;
        }

        /* Empty state */
        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: #64748B;
        }
        .chat-empty-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .chat-empty-icon svg {
            width: 100%;
            height: 100%;
            stroke-width: 1;
        }
        .chat-empty-title {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 6px;
        }
        .chat-empty-text {
            font-size: 13.5px;
            max-width: 320px;
            line-height: 1.6;
        }

        /* Typing indicator */
        .typing-indicator {
            padding: 0 20px 8px;
            font-size: 12px;
            color: #64748B;
            font-style: italic;
            height: 20px;
            transition: opacity 0.2s;
            opacity: 0;
        }
        .typing-indicator.visible {
            opacity: 1;
        }

        /* Loader */
        .loading-conversations {
            padding: 40px 20px;
            text-align: center;
            color: #64748B;
            font-size: 13px;
        }

        @media (max-width: 900px) {
            .chat-layout {
                grid-template-columns: 1fr;
            }
            .conversations-panel {
                display: none;
            }
            .conversations-panel.mobile-visible {
                display: flex;
                position: absolute;
                inset: 0;
                z-index: 10;
            }
            .chat-panel {
                position: relative;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar"></aside>

    <main class="app-main">

        <!-- TOPBAR -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search equipment...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="app-content">

            <div class="page-header">
                <h1 class="page-title">Messages</h1>
                <p class="page-subtitle">Chat with equipment owners in real time</p>
            </div>

            <div class="chat-layout">

                <!-- LEFT: conversations -->
                <div class="conversations-panel" id="conversationsPanel">
                    <div class="conversations-header">
                        <div class="conversations-header-title">Conversations</div>
                        <div class="conversations-search">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <circle cx="11" cy="11" r="7"/>
                                <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                            </svg>
                            <input type="text" id="conversationSearch" placeholder="Search conversations...">
                        </div>
                    </div>
                    <div class="conversations-list" id="conversationsList">
                        <div class="loading-conversations">Loading conversations...</div>
                    </div>
                </div>

                <!-- RIGHT: chat -->
                <div class="chat-panel" id="chatPanel">
                    <div class="chat-empty" id="chatEmpty">
                        <div class="chat-empty-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a8 8 0 11-3.5 6.6L3 21l2.4-6.5A8 8 0 0121 12z"/>
                            </svg>
                        </div>
                        <div class="chat-empty-title">Select a conversation</div>
                        <div class="chat-empty-text">
                            Choose a conversation from the left to start chatting with an equipment owner.
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    const user = Auth.requireAuth('customer');
    if (!user) throw new Error('Not authorized');

    Sidebar.render();
    UI.initShell();

    // State
    let socket = null;
    let conversations = [];
    let activeConversation = null;
    let activeMessages = [];
    let typingTimeout = null;

    const targetUserId = Utils.getQueryParam('user');

    // Init
    async function init() {
        // Connect socket
        connectSocket();

        // Load conversations
        await loadConversations();

        // If URL has ?user=X, open that conversation
        if (targetUserId) {
            openConversationById(parseInt(targetUserId, 10));
        }
    }

    // Socket.io connection
    function connectSocket() {
        const token = Storage.getToken();
        if (!token) return;

        socket = io(CONFIG.API_BASE_URL, {
            auth: { token: token },
            transports: ['websocket', 'polling']
        });

        socket.on('connect', function () {
            console.log('Socket connected:', socket.id);
        });

        socket.on('connect_error', function (err) {
            console.error('Socket error:', err.message);
            UI.toast('Chat connection failed. Refresh to retry.', 'error');
        });

        socket.on('receive_message', function (msg) {
            // Only handle messages for the active conversation
            if (!activeConversation) return;

            const isForActive =
                (msg.sender_id === activeConversation.other_user_id && msg.receiver_id === user.user_id) ||
                (msg.sender_id === user.user_id && msg.receiver_id === activeConversation.other_user_id);

            if (!isForActive) return;

            // Avoid duplicates (in case we sent it ourselves and already added it)
            if (activeMessages.some(function (m) { return m.message_id === msg.message_id; })) return;

            activeMessages.push(msg);
            appendMessage(msg);
            scrollToBottom();

            // Mark as read
            if (msg.receiver_id === user.user_id) {
                socket.emit('mark_read', { other_user_id: msg.sender_id });
            }

            // Refresh conversation list preview
            loadConversations(true);
        });

        socket.on('user_typing', function (data) {
            if (!activeConversation) return;
            if (data.user_id !== activeConversation.other_user_id) return;

            const indicator = document.getElementById('typingIndicator');
            if (!indicator) return;

            if (data.is_typing) {
                indicator.textContent = activeConversation.other_user_name + ' is typing...';
                indicator.classList.add('visible');
            } else {
                indicator.classList.remove('visible');
            }
        });

        socket.on('messages_read', function (data) {
            // Update active messages marked as read
            if (!activeConversation) return;
            activeMessages.forEach(function (m) {
                if (m.receiver_id === data.reader_id) m.is_read = true;
            });
        });
    }

    // Load conversations list
    async function loadConversations(silent) {
        if (!silent) {
            document.getElementById('conversationsList').innerHTML =
                '<div class="loading-conversations">Loading conversations...</div>';
        }

        try {
            const data = await Api.getConversations();
            conversations = data.conversations || [];
            renderConversations();
            updateSidebarBadge();
        } catch (err) {
            console.error('Failed to load conversations:', err);
            document.getElementById('conversationsList').innerHTML =
                '<div style="padding: 20px; text-align: center; color: #991b1b; font-size: 13px;">' +
                    'Failed to load conversations' +
                '</div>';
        }
    }

    function renderConversations() {
        const container = document.getElementById('conversationsList');

        if (conversations.length === 0) {
            container.innerHTML =
                '<div style="padding: 40px 20px; text-align: center;">' +
                    '<div style="font-size: 13.5px; color: #64748B; line-height: 1.6;">' +
                        'No conversations yet.<br>Start by contacting an equipment owner.' +
                    '</div>' +
                    '<a href="/customer/browse.html" class="btn btn-outline btn-sm mt-4">Browse Equipment</a>' +
                '</div>';
            return;
        }

        container.innerHTML = conversations.map(function (c) {
            const initials = Utils.initials(c.other_user_name);
            const unread = c.unread_count > 0;
            const isActive = activeConversation && activeConversation.other_user_id === c.other_user_id;

            return '<div class="conversation-item' + (isActive ? ' active' : '') + '" ' +
                'data-user-id="' + c.other_user_id + '" ' +
                'data-user-name="' + Utils.escapeHtml(c.other_user_name) + '">' +
                '<div class="conversation-avatar">' + Utils.escapeHtml(initials) + '</div>' +
                '<div class="conversation-body">' +
                    '<div class="conversation-top">' +
                        '<div class="conversation-name">' + Utils.escapeHtml(c.other_user_name) + '</div>' +
                        '<div class="conversation-time">' + Utils.timeAgo(c.last_message_time) + '</div>' +
                    '</div>' +
                    '<div class="conversation-bottom">' +
                        '<div class="conversation-preview' + (unread ? ' unread' : '') + '">' +
                            Utils.escapeHtml(c.last_message || '') +
                        '</div>' +
                        (unread ? '<div class="conversation-unread">' + c.unread_count + '</div>' : '') +
                    '</div>' +
                '</div>' +
            '</div>';
        }).join('');

        // Wire click handlers
        container.querySelectorAll('.conversation-item').forEach(function (item) {
            item.addEventListener('click', function () {
                const userId = parseInt(item.dataset.userId, 10);
                const userName = item.dataset.userName;
                openConversation(userId, userName);
            });
        });
    }

    function openConversationById(userId) {
        const conv = conversations.find(function (c) { return c.other_user_id === userId; });
        if (conv) {
            openConversation(conv.other_user_id, conv.other_user_name);
        } else {
            // Conversation does not exist yet — allow starting a new one
            openConversation(userId, 'User ' + userId);
        }
    }

    async function openConversation(otherUserId, otherUserName) {
        activeConversation = {
            other_user_id: otherUserId,
            other_user_name: otherUserName
        };

        renderConversations(); // Update active highlight
        renderChatHeader();
        renderChatBody();
        renderChatInput();

        // Join socket room
        if (socket) {
            socket.emit('join_room', { other_user_id: otherUserId });
        }

        // Load history
        await loadHistory(otherUserId);

        // Focus input
        setTimeout(function () {
            const input = document.getElementById('chatInput');
            if (input) input.focus();
        }, 100);

        // Update URL
        window.history.replaceState({}, '', '/customer/chat.html?user=' + otherUserId);
    }

    function renderChatHeader() {
        const panel = document.getElementById('chatPanel');
        const initials = Utils.initials(activeConversation.other_user_name);

        panel.innerHTML =
            '<div class="chat-header">' +
                '<button class="topbar-icon-btn" onclick="showConversationsMobile()" style="display: none;">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>' +
                '</button>' +
                '<div class="chat-header-avatar">' + Utils.escapeHtml(initials) + '</div>' +
                '<div class="chat-header-info">' +
                    '<div class="chat-header-name">' + Utils.escapeHtml(activeConversation.other_user_name) + '</div>' +
                    '<div class="chat-header-status online">' +
                        '<span class="chat-header-status-dot"></span> Active on EventEquip' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="chat-messages" id="chatMessages">' +
                '<div style="text-align: center; padding: 20px;">' +
                    '<div class="spinner spinner-dark" style="width: 24px; height: 24px; border-width: 2px; display: inline-block;"></div>' +
                '</div>' +
            '</div>' +
            '<div class="typing-indicator" id="typingIndicator"></div>';
    }

    function renderChatBody() {
        // Body is rendered by renderChatHeader, and messages are appended after history loads
    }

    function renderChatInput() {
        const panel = document.getElementById('chatPanel');

        const inputHtml =
            '<div class="chat-input-area">' +
                '<div class="chat-input-wrapper">' +
                    '<textarea class="chat-input" id="chatInput" rows="1" ' +
                        'placeholder="Type a message..."></textarea>' +
                '</div>' +
                '<button class="chat-send-btn" id="chatSendBtn" disabled>' +
                    '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                        '<path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>' +
                    '</svg>' +
                '</button>' +
            '</div>';

        panel.insertAdjacentHTML('beforeend', inputHtml);

        const input = document.getElementById('chatInput');
        const sendBtn = document.getElementById('chatSendBtn');

        input.addEventListener('input', function () {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            sendBtn.disabled = !this.value.trim();

            // Typing indicator
            if (socket && activeConversation) {
                socket.emit('typing', {
                    receiver_id: activeConversation.other_user_id,
                    is_typing: true
                });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(function () {
                    socket.emit('typing', {
                        receiver_id: activeConversation.other_user_id,
                        is_typing: false
                    });
                }, 1500);
            }
        });

        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
    }

    async function loadHistory(otherUserId) {
        try {
            const data = await Api.getChatHistory(otherUserId);
            activeMessages = data.messages || [];
            renderMessages();
        } catch (err) {
            console.error('Failed to load history:', err);
            document.getElementById('chatMessages').innerHTML =
                '<div class="alert alert-danger" style="margin: 20px;">' +
                    'Failed to load message history.' +
                '</div>';
        }
    }

    function renderMessages() {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        if (activeMessages.length === 0) {
            container.innerHTML =
                '<div style="text-align: center; padding: 40px 20px; color: #64748B; font-size: 13.5px;">' +
                    'No messages yet. Say hi to start the conversation!' +
                '</div>';
            return;
        }

        container.innerHTML = activeMessages.map(function (m) {
            return messageHtml(m);
        }).join('');

        scrollToBottom();
    }

    function messageHtml(m) {
        const isSent = m.sender_id === user.user_id;
        const initials = Utils.initials(isSent ? user.full_name : activeConversation.other_user_name);

        return '<div class="message-row ' + (isSent ? 'sent' : 'received') + '">' +
            '<div class="message-avatar">' + Utils.escapeHtml(initials) + '</div>' +
            '<div>' +
                '<div class="message-bubble">' + Utils.escapeHtml(m.message_text) + '</div>' +
                '<div class="message-time">' + Utils.formatDateTime(m.sent_at) + '</div>' +
            '</div>' +
        '</div>';
    }

    function appendMessage(m) {
        const container = document.getElementById('chatMessages');
        if (!container) return;

        // Remove empty state if present
        if (container.children.length === 1 &&
            container.children[0].textContent.indexOf('No messages yet') !== -1) {
            container.innerHTML = '';
        }

        container.insertAdjacentHTML('beforeend', messageHtml(m));
    }

    function scrollToBottom() {
        const container = document.getElementById('chatMessages');
        if (container) {
            container.scrollTop = container.scrollHeight;
        }
    }

    function sendMessage() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !socket || !activeConversation) return;

        socket.emit('send_message', {
            receiver_id: activeConversation.other_user_id,
            message_text: text
        });

        input.value = '';
        input.style.height = 'auto';
        document.getElementById('chatSendBtn').disabled = true;

        // Stop typing indicator
        socket.emit('typing', {
            receiver_id: activeConversation.other_user_id,
            is_typing: false
        });
    }

    // Sidebar unread badge
    function updateSidebarBadge() {
        const totalUnread = conversations.reduce(function (sum, c) {
            return sum + (c.unread_count || 0);
        }, 0);

        document.querySelectorAll('[data-badge="unread"]').forEach(function (el) {
            if (totalUnread > 0) {
                el.textContent = totalUnread;
                el.style.display = 'inline-block';
            } else {
                el.style.display = 'none';
            }
        });
    }

    // Mobile: show conversations panel
    function showConversationsMobile() {
        document.getElementById('conversationsPanel').classList.add('mobile-visible');
    }

    // Conversation search
    document.getElementById('conversationSearch').addEventListener('input', function (e) {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('.conversation-item').forEach(function (item) {
            const name = item.querySelector('.conversation-name').textContent.toLowerCase();
            item.style.display = name.indexOf(q) !== -1 ? 'flex' : 'none';
        });
    });

    // Topbar search
    document.getElementById('topSearch').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const q = e.target.value.trim();
            if (q) window.location.href = '/customer/browse.html?search=' + encodeURIComponent(q);
        }
    });

    init();
</script>

    <script defer src="/assets/js/motion.js"></script>
</body>
