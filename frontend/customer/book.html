<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Book Equipment - EventEquip Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .booking-layout {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 32px;
            align-items: start;
        }

        .booking-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .booking-card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .booking-card-title svg {
            width: 18px;
            height: 18px;
            color: #F97316;
            stroke-width: 2.5;
        }
        .booking-card-subtitle {
            font-size: 13px;
            color: #64748B;
            margin-bottom: 20px;
        }

        /* Calendar */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .calendar-month {
            font-size: 15px;
            font-weight: 700;
            color: #0F172A;
        }
        .calendar-nav {
            display: flex;
            gap: 4px;
        }
        .calendar-nav button {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid #e2e8f0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .calendar-nav button:hover:not(:disabled) {
            border-color: #1E3A8A;
            color: #1E3A8A;
        }
        .calendar-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .calendar-nav svg {
            width: 16px;
            height: 16px;
            stroke-width: 2.5;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-dow {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 0;
        }
        .calendar-day {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            background: transparent;
            border: none;
            color: #0F172A;
            font-family: inherit;
        }
        .calendar-day:hover:not(:disabled) {
            background: #F1F5F9;
        }
        .calendar-day:disabled {
            color: #cbd5e1;
            cursor: not-allowed;
        }
        .calendar-day.other-month {
            color: #cbd5e1;
        }
        .calendar-day.today {
            font-weight: 700;
            box-shadow: inset 0 0 0 1px #cbd5e1;
        }
        .calendar-day.start-date,
        .calendar-day.end-date {
            background: #1E3A8A;
            color: white;
            font-weight: 700;
        }
        .calendar-day.in-range {
            background: #dbeafe;
            color: #1e40af;
        }
        .calendar-day.start-date:hover,
        .calendar-day.end-date:hover {
            background: #1E3A8A;
        }

        .date-summary {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .date-summary-item {
            flex: 1;
            min-width: 140px;
        }
        .date-summary-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #64748B;
            margin-bottom: 4px;
        }
        .date-summary-value {
            font-size: 14.5px;
            font-weight: 600;
            color: #0F172A;
        }
        .date-summary-days {
            color: #F97316;
            font-weight: 700;
        }

        /* Quantity */
        .qty-selector {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .qty-btn {
            width: 44px;
            height: 44px;
            border-radius: 8px;
            border: 1.5px solid #e2e8f0;
            background: white;
            cursor: pointer;
            font-size: 20px;
            font-weight: 600;
            color: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .qty-btn:hover:not(:disabled) {
            border-color: #1E3A8A;
            color: #1E3A8A;
        }
        .qty-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .qty-input {
            width: 80px;
            height: 44px;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-family: inherit;
        }
        .qty-input:focus {
            outline: none;
            border-color: #1E3A8A;
        }
        .qty-info {
            margin-left: auto;
            font-size: 12.5px;
            color: #64748B;
        }

        /* Delivery */
        .delivery-methods {
            display: grid;
            gap: 12px;
            margin-top: 4px;
        }
        .delivery-method {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .delivery-method:hover {
            border-color: #cbd5e1;
        }
        .delivery-method.active {
            border-color: #1E3A8A;
            background: #eff6ff;
        }
        .delivery-method input[type="radio"] {
            margin-top: 3px;
            accent-color: #1E3A8A;
        }
        .delivery-method-body {
            flex: 1;
        }
        .delivery-method-title {
            font-size: 14px;
            font-weight: 600;
            color: #0F172A;
            margin-bottom: 2px;
        }
        .delivery-method-desc {
            font-size: 12.5px;
            color: #64748B;
        }
        .delivery-method-price {
            font-size: 14px;
            font-weight: 700;
            color: #F97316;
            margin-left: auto;
            white-space: nowrap;
        }

        /* Summary */
        .summary-card {
            position: sticky;
            top: 88px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
        }
        .summary-equipment {
            display: flex;
            gap: 12px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }
        .summary-equipment-thumb {
            width: 64px;
            height: 64px;
            border-radius: 10px;
            background: #F8FAFC;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
        .summary-equipment-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .summary-equipment-thumb svg {
            width: 28px;
            height: 28px;
            stroke-width: 1.5;
        }
        .summary-equipment-info {
            flex: 1;
            min-width: 0;
        }
        .summary-equipment-title {
            font-size: 14px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .summary-equipment-owner {
            font-size: 12px;
            color: #64748B;
        }
        .summary-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13.5px;
            color: #64748B;
        }
        .summary-row span:last-child {
            color: #0F172A;
            font-weight: 600;
        }
        .summary-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 16px;
            border-top: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .summary-total-label {
            font-size: 14px;
            font-weight: 700;
            color: #0F172A;
        }
        .summary-total-value {
            font-size: 24px;
            font-weight: 700;
            color: #F97316;
        }
        .summary-note {
            font-size: 12px;
            color: #64748B;
            text-align: center;
            margin-top: 12px;
            line-height: 1.5;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
        }

        @media (max-width: 1024px) {
            .booking-layout {
                grid-template-columns: 1fr;
            }
            .summary-card {
                position: static;
            }
        }
        @media (max-width: 600px) {
            .booking-card {
                padding: 20px;
            }
            .date-summary {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>

<div class="app-shell">

    <!-- SIDEBAR -->
    <aside class="sidebar"></aside>

    <!-- MAIN CONTENT -->
    <main class="app-main">

        <!-- TOPBAR -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search equipment...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" onclick="window.location.href='/customer/chat.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a8 8 0 11-3.5 6.6L3 21l2.4-6.5A8 8 0 0121 12z"/>
                    </svg>
                    <span class="topbar-icon-badge" id="chatBadge" style="display: none;">0</span>
                </button>
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="app-content" id="pageContent">
            <div class="loading-state">
                <div class="spinner spinner-dark" style="width: 32px; height: 32px; border-width: 3px;"></div>
                <p style="margin-top: 16px;">Loading booking form...</p>
            </div>
        </div>
    </main>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    // Require customer
    const user = Auth.requireAuth('customer');
    if (!user) throw new Error('Not authorized');

    Sidebar.render();
    UI.initShell();
    Sidebar.updateUnreadBadge();

    // State
    const equipmentId = Utils.getQueryParam('id');
    const initialQty = Math.max(1, parseInt(Utils.getQueryParam('qty'), 10) || 1);

    let equipment = null;
    let startDate = null;
    let endDate = null;
    let deliveryFee = 0;
    let deliveryMethod = 'delivery';

    // Calendar state
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();

    // Init
    async function init() {
        if (!equipmentId) {
            document.getElementById('pageContent').innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-state-title">Equipment not specified</div>' +
                    '<div class="empty-state-message">No equipment was selected for booking.</div>' +
                    '<a href="/customer/browse.html" class="btn btn-primary">Browse Equipment</a>' +
                '</div>';
            return;
        }

        try {
            const data = await Api.getEquipmentById(equipmentId);
            equipment = data.equipment;
            renderPage();
        } catch (err) {
            console.error('Failed to load equipment:', err);
            document.getElementById('pageContent').innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-state-title">Failed to load equipment</div>' +
                    '<div class="empty-state-message">' + Utils.escapeHtml(err.message) + '</div>' +
                    '<a href="/customer/browse.html" class="btn btn-primary">Back to Browse</a>' +
                '</div>';
        }
    }

    function renderPage() {
        const e = equipment;
        const imageUrl = Utils.imageUrl((e.images && e.images[0] && e.images[0].image_url) || '');
        const imageHtml = imageUrl
            ? '<img src="' + Utils.escapeHtml(imageUrl) + '" alt="">'
            : '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3l9 7-2 11H5L3 10l9-7z"/>' +
              '</svg>';

        const html =
            '<div class="breadcrumb">' +
                '<a href="/customer/browse.html">Browse Equipment</a>' +
                '<span class="breadcrumb-separator">/</span>' +
                '<a href="/customer/equipment.html?id=' + e.equipment_id + '">' + Utils.escapeHtml(e.name) + '</a>' +
                '<span class="breadcrumb-separator">/</span>' +
                '<span>Book</span>' +
            '</div>' +

            '<div class="page-header">' +
                '<h1 class="page-title">Book Equipment</h1>' +
                '<p class="page-subtitle">Choose your rental dates and confirm your booking</p>' +
            '</div>' +

            '<div class="booking-layout">' +

                // LEFT COLUMN
                '<div>' +

                    // Calendar card
                    '<div class="booking-card">' +
                        '<div class="booking-card-title">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                                '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
                                '<path d="M16 2v4M8 2v4M3 10h18"/>' +
                            '</svg>' +
                            'Select Rental Dates' +
                        '</div>' +
                        '<div class="booking-card-subtitle">Pick your start and end dates. Minimum rental is 1 day.</div>' +

                        '<div id="calendarContainer"></div>' +

                        '<div class="date-summary">' +
                            '<div class="date-summary-item">' +
                                '<div class="date-summary-label">Start Date</div>' +
                                '<div class="date-summary-value" id="startDateDisplay">Not selected</div>' +
                            '</div>' +
                            '<div class="date-summary-item">' +
                                '<div class="date-summary-label">End Date</div>' +
                                '<div class="date-summary-value" id="endDateDisplay">Not selected</div>' +
                            '</div>' +
                            '<div class="date-summary-item">' +
                                '<div class="date-summary-label">Duration</div>' +
                                '<div class="date-summary-value"><span class="date-summary-days" id="daysDisplay">0</span> <span id="daysLabel">days</span></div>' +
                            '</div>' +
                        '</div>' +
                    '</div>' +

                    // Quantity card
                    '<div class="booking-card">' +
                        '<div class="booking-card-title">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                                '<path d="M20 7L9 18l-5-5"/>' +
                            '</svg>' +
                            'Quantity' +
                        '</div>' +
                        '<div class="booking-card-subtitle">How many units do you need?</div>' +
                        '<div class="qty-selector">' +
                            '<button type="button" class="qty-btn" onclick="adjustQty(-1)" id="qtyMinus">&minus;</button>' +
                            '<input type="number" class="qty-input" id="qtyInput" value="' + initialQty + '" min="1" max="' + e.quantity_available + '">' +
                            '<button type="button" class="qty-btn" onclick="adjustQty(1)" id="qtyPlus">+</button>' +
                            '<div class="qty-info">Max: <strong>' + e.quantity_available + '</strong> units available</div>' +
                        '</div>' +
                    '</div>' +

                    // Delivery card
                    '<div class="booking-card">' +
                        '<div class="booking-card-title">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                                '<path d="M3 12h11l-3-3m3 3l-3 3M14 6l7 6-7 6"/>' +
                            '</svg>' +
                            'Delivery Method' +
                        '</div>' +
                        '<div class="booking-card-subtitle">Choose how you want to receive the equipment</div>' +

                        '<div class="delivery-methods">' +
                            '<label class="delivery-method active" data-method="delivery">' +
                                '<input type="radio" name="delivery" value="delivery" checked onchange="setDelivery(\'delivery\')">' +
                                '<div class="delivery-method-body">' +
                                    '<div class="delivery-method-title">Deliver to my venue</div>' +
                                    '<div class="delivery-method-desc">The owner will deliver and set up at your location</div>' +
                                '</div>' +
                                '<div class="delivery-method-price">KSh 2,000</div>' +
                            '</label>' +

                            '<label class="delivery-method" data-method="pickup">' +
                                '<input type="radio" name="delivery" value="pickup" onchange="setDelivery(\'pickup\')">' +
                                '<div class="delivery-method-body">' +
                                    '<div class="delivery-method-title">Pick up from owner</div>' +
                                    '<div class="delivery-method-desc">Collect from ' + Utils.escapeHtml(e.location) + ' at no cost</div>' +
                                '</div>' +
                                '<div class="delivery-method-price">Free</div>' +
                            '</label>' +
                        '</div>' +

                        '<div class="form-group mt-6" id="addressGroup">' +
                            '<label class="form-label" for="deliveryAddress">Delivery Address</label>' +
                            '<textarea class="form-textarea" id="deliveryAddress" placeholder="Enter the venue name, street, and any landmarks"></textarea>' +
                            '<div class="form-hint">Provide full details so the owner can find your venue.</div>' +
                        '</div>' +
                    '</div>' +

                    // Contact card
                    '<div class="booking-card">' +
                        '<div class="booking-card-title">' +
                            '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                                '<circle cx="12" cy="12" r="10"/>' +
                                '<path d="M12 16v-4M12 8h.01"/>' +
                            '</svg>' +
                            'Additional Notes (Optional)' +
                        '</div>' +
                        '<div class="booking-card-subtitle">Anything the owner should know?</div>' +
                        '<textarea class="form-textarea" id="bookingNotes" placeholder="Special requests, setup instructions, or questions for the owner"></textarea>' +
                    '</div>' +
                '</div>' +

                // RIGHT COLUMN
                '<div>' +
                    '<div class="summary-card">' +
                        '<div class="summary-equipment">' +
                            '<div class="summary-equipment-thumb">' + imageHtml + '</div>' +
                            '<div class="summary-equipment-info">' +
                                '<div class="summary-equipment-title">' + Utils.escapeHtml(e.name) + '</div>' +
                                '<div class="summary-equipment-owner">by ' + Utils.escapeHtml(e.business_name || e.owner_full_name) + '</div>' +
                            '</div>' +
                        '</div>' +

                        '<div class="summary-list">' +
                            '<div class="summary-row">' +
                                '<span>Unit price</span>' +
                                '<span>' + Utils.formatCurrency(e.price_per_day) + ' / day</span>' +
                            '</div>' +
                            '<div class="summary-row">' +
                                '<span>Quantity</span>' +
                                '<span id="summaryQty">1</span>' +
                            '</div>' +
                            '<div class="summary-row">' +
                                '<span>Duration</span>' +
                                '<span id="summaryDays">0 days</span>' +
                            '</div>' +
                            '<div class="summary-row">' +
                                '<span>Subtotal</span>' +
                                '<span id="summarySubtotal">KSh 0</span>' +
                            '</div>' +
                            '<div class="summary-row">' +
                                '<span>Delivery</span>' +
                                '<span id="summaryDelivery">KSh 2,000</span>' +
                            '</div>' +
                            '<div class="summary-row">' +
                                '<span>Service fee (10%)</span>' +
                                '<span id="summaryService">KSh 0</span>' +
                            '</div>' +
                        '</div>' +

                        '<div class="summary-total">' +
                            '<div class="summary-total-label">Total</div>' +
                            '<div class="summary-total-value" id="summaryTotal">KSh 0</div>' +
                        '</div>' +

                        '<button class="btn btn-primary btn-block btn-lg" id="submitBtn">' +
                            'Confirm Booking' +
                        '</button>' +
                        '<div class="summary-note">' +
                            'You will be redirected to M-Pesa to complete payment after confirmation.' +
                        '</div>' +
                    '</div>' +
                '</div>' +

            '</div>';

        document.getElementById('pageContent').innerHTML = html;

        renderCalendar();
        wireEvents();
        updateSummary();
    }

    // Calendar rendering
    function renderCalendar() {
        const container = document.getElementById('calendarContainer');
        const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                            'July', 'August', 'September', 'October', 'November', 'December'];

        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const daysInMonth = lastDay.getDate();
        const startDow = firstDay.getDay();

        // Previous month fill
        const prevMonthLastDay = new Date(currentYear, currentMonth, 0).getDate();

        let html = '';
        html += '<div class="calendar-header">';
        html += '<div class="calendar-month">' + monthNames[currentMonth] + ' ' + currentYear + '</div>';
        html += '<div class="calendar-nav">';
        html += '<button type="button" onclick="prevMonth()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg></button>';
        html += '<button type="button" onclick="nextMonth()"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg></button>';
        html += '</div>';
        html += '</div>';

        html += '<div class="calendar-grid">';
        ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(function (d) {
            html += '<div class="calendar-dow">' + d + '</div>';
        });

        // Leading days from previous month
        for (let i = startDow - 1; i >= 0; i--) {
            const day = prevMonthLastDay - i;
            html += '<button type="button" class="calendar-day other-month" disabled>' + day + '</button>';
        }

        // Current month days
        for (let d = 1; d <= daysInMonth; d++) {
            const date = new Date(currentYear, currentMonth, d);
            date.setHours(0, 0, 0, 0);

            const isPast = date < today;
            const isToday = date.getTime() === today.getTime();

            let classes = 'calendar-day';
            if (isPast) classes += ' disabled';
            if (isToday) classes += ' today';

            // Check if in selected range
            if (startDate && endDate) {
                const t = date.getTime();
                const s = startDate.getTime();
                const en = endDate.getTime();
                if (t === s) classes += ' start-date';
                else if (t === en) classes += ' end-date';
                else if (t > s && t < en) classes += ' in-range';
            } else if (startDate && date.getTime() === startDate.getTime()) {
                classes += ' start-date';
            }

            html += '<button type="button" class="' + classes + '" ' +
                (isPast ? 'disabled' : '') +
                ' onclick="selectDate(new Date(' + currentYear + ',' + currentMonth + ',' + d + '))">' + d + '</button>';
        }

        // Trailing days
        const totalCells = startDow + daysInMonth;
        const trailing = (7 - (totalCells % 7)) % 7;
        for (let d = 1; d <= trailing; d++) {
            html += '<button type="button" class="calendar-day other-month" disabled>' + d + '</button>';
        }

        html += '</div>';

        container.innerHTML = html;
    }

    function prevMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        renderCalendar();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        renderCalendar();
    }

    function selectDate(date) {
        date.setHours(0, 0, 0, 0);

        if (!startDate || (startDate && endDate)) {
            // Start new selection
            startDate = date;
            endDate = null;
        } else if (date < startDate) {
            // Clicked before start, swap
            endDate = startDate;
            startDate = date;
        } else if (date.getTime() === startDate.getTime()) {
            // Clicked same day, deselect
            startDate = null;
            endDate = null;
        } else {
            // Set end date
            endDate = date;
        }

        renderCalendar();
        updateDatesDisplay();
        updateSummary();
    }

    function updateDatesDisplay() {
        const startDisplay = document.getElementById('startDateDisplay');
        const endDisplay = document.getElementById('endDateDisplay');
        const daysDisplay = document.getElementById('daysDisplay');
        const daysLabel = document.getElementById('daysLabel');

        if (startDate) {
            startDisplay.textContent = Utils.formatDate(startDate.toISOString());
        } else {
            startDisplay.textContent = 'Not selected';
        }

        if (endDate) {
            endDisplay.textContent = Utils.formatDate(endDate.toISOString());
        } else {
            endDisplay.textContent = 'Not selected';
        }

        const days = getDays();
        daysDisplay.textContent = days;
        daysLabel.textContent = days === 1 ? 'day' : 'days';
    }

    function getDays() {
        if (!startDate || !endDate) return 0;
        return Math.round((endDate - startDate) / (1000 * 60 * 60 * 24)) + 1;
    }

    // Quantity
    function adjustQty(delta) {
        const input = document.getElementById('qtyInput');
        const max = Number(equipment.quantity_available || 1);
        let val = Number(input.value) + delta;
        if (val < 1) val = 1;
        if (val > max) val = max;
        input.value = val;
        updateSummary();
    }

    function setDelivery(method) {
        deliveryMethod = method;
        deliveryFee = method === 'delivery' ? 2000 : 0;

        // Update active state
        document.querySelectorAll('.delivery-method').forEach(function (el) {
            el.classList.toggle('active', el.dataset.method === method);
        });

        // Show or hide address field
        document.getElementById('addressGroup').style.display = method === 'delivery' ? 'block' : 'none';

        updateSummary();
    }

    // Summary
    function updateSummary() {
        const qty = Number(document.getElementById('qtyInput').value) || 1;
        const days = getDays();
        const unitPrice = Number(equipment.price_per_day) || 0;

        const subtotal = qty * unitPrice * days;
        const serviceFee = subtotal * 0.10;
        const total = subtotal + deliveryFee + serviceFee;

        document.getElementById('summaryQty').textContent = qty + ' ' + (qty === 1 ? 'unit' : 'units');
        document.getElementById('summaryDays').textContent = days + ' ' + (days === 1 ? 'day' : 'days');
        document.getElementById('summarySubtotal').textContent = Utils.formatCurrency(subtotal);
        document.getElementById('summaryDelivery').textContent = deliveryFee === 0 ? 'Free' : Utils.formatCurrency(deliveryFee);
        document.getElementById('summaryService').textContent = Utils.formatCurrency(serviceFee);
        document.getElementById('summaryTotal').textContent = Utils.formatCurrency(total);

        // Enable or disable submit
        const submitBtn = document.getElementById('submitBtn');
        if (!startDate || !endDate || days === 0) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Select dates to continue';
        } else if (deliveryMethod === 'delivery' && !document.getElementById('deliveryAddress').value.trim()) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enter delivery address';
        } else {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Confirm Booking';
        }
    }

    function wireEvents() {
        // Quantity input
        document.getElementById('qtyInput').addEventListener('input', function () {
            const max = Number(equipment.quantity_available || 1);
            let val = Number(this.value) || 1;
            if (val < 1) val = 1;
            if (val > max) val = max;
            this.value = val;
            updateSummary();
        });

        // Delivery address
        document.getElementById('deliveryAddress').addEventListener('input', updateSummary);

        // Submit
        document.getElementById('submitBtn').addEventListener('click', submitBooking);
    }

    async function submitBooking() {
        const submitBtn = document.getElementById('submitBtn');
        const qty = Number(document.getElementById('qtyInput').value) || 1;
        const days = getDays();
        const address = document.getElementById('deliveryAddress').value.trim();
        const notes = document.getElementById('bookingNotes').value.trim();

        if (!startDate || !endDate) {
            UI.toast('Please select rental dates', 'warning');
            return;
        }

        if (deliveryMethod === 'delivery' && !address) {
            UI.toast('Please enter a delivery address', 'warning');
            return;
        }

        // Format dates as YYYY-MM-DD
        const start = startDate.toISOString().slice(0, 10);
        const end = endDate.toISOString().slice(0, 10);

        const restore = UI.buttonLoading(submitBtn, 'Creating booking...');

        try {
            const payload = {
                equipment_id: equipment.equipment_id,
                quantity: qty,
                start_date: start,
                end_date: end,
                delivery_address: deliveryMethod === 'delivery' ? address : null
            };

            const result = await Api.createBooking(payload);

            UI.toast('Booking created. Redirecting to payment...', 'success');

            // Redirect to payment page
            setTimeout(function () {
                window.location.href = '/customer/payment.html?booking=' + result.booking.booking_id;
            }, 1000);

        } catch (err) {
            console.error('Booking failed:', err);
            UI.toast(err.message || 'Booking failed. Please try again.', 'error');
            restore();
        }
    }

    // Topbar search
    document.getElementById('topSearch').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const q = e.target.value.trim();
            if (q) window.location.href = '/customer/browse.html?search=' + encodeURIComponent(q);
        }
    });

    init();
</script>
