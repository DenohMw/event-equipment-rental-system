<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Choose a New Password - EventEquip Kenya</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; }
        .auth-card { width: min(100%, 460px); padding: 36px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 18px 45px rgba(15,23,42,.08); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; color: #0f172a; font-weight: 800; text-decoration: none; }
        .brand img { width: 44px; height: 44px; border-radius: 10px; }
        .brand small { display: block; color: #64748b; font-size: 9px; letter-spacing: .16em; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        .subtitle { margin: 0 0 24px; color: #64748b; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 18px; }
        .password-field { position: relative; }
        .password-field .form-input { padding-right: 76px; }
        .password-toggle { position: absolute; top: 50%; right: 10px; min-width: 48px; padding: 7px 5px; transform: translateY(-50%); border: 0; border-radius: 6px; color: #174ea6; background: transparent; font-family: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
        .password-toggle:hover { background: #f1f5f9; }
        .password-toggle:focus-visible { outline: 2px solid #174ea6; outline-offset: 2px; }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>
    <main class="auth-card">
        <a href="/" class="brand"><img src="/assets/images/icons/Icon.png" alt=""><span>EventEquip<small>KENYA</small></span></a>
        <h1>Choose a new password</h1>
        <p class="subtitle">Choose a new password for your account.</p>
        <div class="alert" id="resetStatus" style="display: none; margin-bottom: 18px;"></div>
        <form id="resetForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="password">New password</label>
                <div class="password-field"><input class="form-input" id="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button></div>
            </div>
            <div class="form-group">
                <label class="form-label" for="confirmPassword">Confirm new password</label>
                <div class="password-field"><input class="form-input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false">Show</button></div>
            </div>
            <button class="btn btn-primary btn-block" id="resetBtn" type="submit">Update password</button>
        </form>
        <div style="margin-top: 22px; text-align: center; font-size: 13px;"><a href="/login.html">Back to sign in</a></div>
    </main>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script src="/assets/js/password-toggle.js"></script>
    <script>
        const resetPhone = sessionStorage.getItem('eventequip_reset_phone') || '';
        const resetOtp = sessionStorage.getItem('eventequip_reset_otp') || '';
        const statusBox = document.getElementById('resetStatus');
        function showStatus(message, type) {
            statusBox.className = 'alert alert-' + type;
            statusBox.textContent = message;
            statusBox.style.display = 'flex';
        }
        if (!resetPhone || !/^\d{6}$/.test(resetOtp)) {
            document.getElementById('resetBtn').disabled = true;
            showStatus('Verify your phone code before choosing a new password.', 'warning');
        }
        document.getElementById('resetForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const confirmation = document.getElementById('confirmPassword').value;
            if (password.length < 8) return showStatus('Password must be at least 8 characters.', 'danger');
            if (password !== confirmation) return showStatus('The passwords do not match.', 'danger');
            const button = document.getElementById('resetBtn');
            const restore = UI.buttonLoading(button, 'Updating password...');
            try {
                const result = await Api.resetPassword(resetPhone, resetOtp, password);
                sessionStorage.removeItem('eventequip_reset_phone');
                sessionStorage.removeItem('eventequip_reset_otp');
                document.getElementById('resetForm').style.display = 'none';
                showStatus(result.message, 'success');
            } catch (err) {
                showStatus(err.message || 'The code is invalid or expired. Request a new code and try again.', 'danger');
            } finally {
                restore();
            }
        });
    </script>
    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
