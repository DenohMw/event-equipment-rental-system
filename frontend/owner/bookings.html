<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Bookings - EventEquip Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab {
            padding: 12px 20px;
            font-size: 13.5px;
            font-weight: 600;
            color: #64748B;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: inherit;
        }
        .tab:hover { color: #0F172A; }
        .tab.active {
            color: #F97316;
            border-bottom-color: #F97316;
        }
        .tab-count {
            padding: 1px 8px;
            background: #F1F5F9;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
        }
        .tab.active .tab-count {
            background: #fed7aa;
            color: #ea580c;
        }

        .booking-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .booking-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }
        .booking-item:hover {
            border-color: #cbd5e1;
            box-shadow: 0 4px 6px rgba(15, 23, 42, 0.05);
        }
        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }
        .booking-ref {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #64748B;
            margin-bottom: 4px;
        }
        .booking-title {
            font-size: 16px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 4px;
        }
        .booking-date {
            font-size: 12.5px;
            color: #64748B;
        }
        .booking-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }
        .booking-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .booking-info-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 3px 0;
            font-size: 13px;
        }
        .booking-info-label { color: #64748B; }
        .booking-info-value {
            font-weight: 600;
            color: #0F172A;
            text-align: right;
        }
        .booking-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Contact chips */
        .customer-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #F8FAFC;
            border-radius: 9999px;
            font-size: 12.5px;
            color: #0F172A;
            font-weight: 500;
            margin: 0 8px 8px 0;
        }
        .customer-chip svg {
            width: 12px;
            height: 12px;
            color: #64748B;
            stroke-width: 2.5;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
        }

        @media (max-width: 768px) {
            .booking-header { flex-direction: column; }
            .booking-body { grid-template-columns: 1fr; gap: 16px; }
            .booking-actions { flex-direction: column; }
            .booking-actions .btn { width: 100%; justify-content: center; }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar"></aside>

    <main class="app-main">

        <!-- TOPBAR -->
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search bookings, customers...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" onclick="window.location.href='/owner/chat.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a8 8 0 11-3.5 6.6L3 21l2.4-6.5A8 8 0 0121 12z"/>
                    </svg>
                    <span class="topbar-icon-badge" id="chatBadge" style="display: none;">0</span>
                </button>
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE CONTENT -->
        <div class="app-content">

            <div class="page-header">
                <h1 class="page-title">Bookings</h1>
                <p class="page-subtitle">Manage incoming rental requests for your equipment</p>
            </div>

            <div class="tabs" id="tabs">
                <button class="tab active" data-filter="all">All <span class="tab-count" id="countAll">0</span></button>
                <button class="tab" data-filter="requested">New Requests <span class="tab-count" id="countRequested">0</span></button>
                <button class="tab" data-filter="confirmed">Confirmed <span class="tab-count" id="countConfirmed">0</span></button>
                <button class="tab" data-filter="paid">Paid <span class="tab-count" id="countPaid">0</span></button>
                <button class="tab" data-filter="delivered">Delivered <span class="tab-count" id="countDelivered">0</span></button>
                <button class="tab" data-filter="returned">Returned <span class="tab-count" id="countReturned">0</span></button>
                <button class="tab" data-filter="completed">Completed <span class="tab-count" id="countCompleted">0</span></button>
                <button class="tab" data-filter="cancelled">Cancelled <span class="tab-count" id="countCancelled">0</span></button>
            </div>

            <div class="booking-list" id="bookingList">
                <div class="loading-state">
                    <div class="spinner spinner-dark" style="width: 32px; height: 32px; border-width: 3px; display: inline-block;"></div>
                    <p style="margin-top: 16px;">Loading your bookings...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    const user = Auth.requireAuth('owner');
    if (!user) throw new Error('Not authorized');

    Sidebar.render();
    UI.initShell();
    Sidebar.updateUnreadBadge();

    let allBookings = [];
    let currentFilter = 'all';

    async function init() {
        try {
            const data = await Api.getOwnerBookings();
            allBookings = data.bookings || [];
            updateCounts();
            renderBookings();

            try {
                const unread = await Api.getUnreadCount();
                if (unread.unread > 0) {
                    const badge = document.getElementById('chatBadge');
                    badge.textContent = unread.unread;
                    badge.style.display = 'flex';
                }
            } catch (e) { /* silent */ }

        } catch (err) {
            console.error('Failed to load bookings:', err);
            document.getElementById('bookingList').innerHTML =
                '<div class="alert alert-danger">Failed to load bookings: ' +
                Utils.escapeHtml(err.message) + '</div>';
        }
    }

    function updateCounts() {
        document.getElementById('countAll').textContent = allBookings.length;

        const statuses = ['requested', 'confirmed', 'paid', 'delivered', 'returned', 'completed', 'cancelled'];
        statuses.forEach(function (status) {
            const count = allBookings.filter(function (b) { return b.status === status; }).length;
            const el = document.getElementById('count' + status.charAt(0).toUpperCase() + status.slice(1));
            if (el) el.textContent = count;
        });
    }

    function renderBookings() {
        const container = document.getElementById('bookingList');
        let filtered = allBookings;

        if (currentFilter !== 'all') {
            filtered = allBookings.filter(function (b) { return b.status === currentFilter; });
        }

        if (filtered.length === 0) {
            container.innerHTML =
                '<div class="card">' +
                    '<div class="empty-state">' +
                        '<div class="empty-state-title">' +
                            (currentFilter === 'all' ? 'No bookings yet' : 'No ' + currentFilter + ' bookings') +
                        '</div>' +
                        '<div class="empty-state-message">' +
                            (currentFilter === 'all'
                                ? 'Incoming booking requests for your equipment will appear here.'
                                : 'You have no bookings in this category.') +
                        '</div>' +
                    '</div>' +
                '</div>';
            return;
        }

        container.innerHTML = filtered.map(function (b) {
            return renderBookingItem(b);
        }).join('');

        wireActions();
    }

    function renderBookingItem(b) {
        // Action buttons per status
        const actions = [];

        if (b.status === 'requested') {
            actions.push('<button class="btn btn-success btn-sm" data-action="confirmed" data-booking="' + b.booking_id + '">Confirm Booking</button>');
            actions.push('<button class="btn btn-danger btn-sm" data-action="cancelled" data-booking="' + b.booking_id + '">Decline</button>');
            actions.push('<button class="btn btn-outline btn-sm" data-action="chat" data-customer="' + b.customer_id + '">Chat</button>');
        } else if (b.status === 'confirmed') {
            actions.push('<span class="badge badge-info" style="padding: 8px 14px;">Awaiting customer payment</span>');
            actions.push('<button class="btn btn-outline btn-sm" data-action="chat" data-customer="' + b.customer_id + '">Chat</button>');
        } else if (b.status === 'paid') {
            actions.push('<button class="btn btn-purple btn-sm" data-action="delivered" data-booking="' + b.booking_id + '">Mark as Delivered</button>');
            actions.push('<button class="btn btn-outline btn-sm" data-action="chat" data-customer="' + b.customer_id + '">Chat</button>');
        } else if (b.status === 'delivered') {
            actions.push('<button class="btn btn-warning btn-sm" data-action="rented" data-booking="' + b.booking_id + '">Mark as Rented</button>');
            actions.push('<button class="btn btn-outline btn-sm" data-action="chat" data-customer="' + b.customer_id + '">Chat</button>');
        } else if (b.status === 'rented') {
            actions.push('<button class="btn btn-success btn-sm" data-action="returned" data-booking="' + b.booking_id + '">Mark as Returned</button>');
            actions.push('<button class="btn btn-outline btn-sm" data-action="chat" data-customer="' + b.customer_id + '">Chat</button>');
        } else if (b.status === 'returned') {
            actions.push('<button class="btn btn-success btn-sm" data-action="completed" data-booking="' + b.booking_id + '">Complete Rental</button>');
        } else if (b.status === 'completed') {
            actions.push('<span class="badge badge-success" style="padding: 8px 14px;">Completed</span>');
        } else if (b.status === 'cancelled') {
            actions.push('<span class="badge badge-danger" style="padding: 8px 14px;">Cancelled</span>');
        }

        return '<div class="booking-item">' +
            '<div class="booking-header">' +
                '<div>' +
                    '<div class="booking-ref">' + Utils.escapeHtml(b.booking_ref) + '</div>' +
                    '<div class="booking-title">' + Utils.escapeHtml(b.equipment_name || 'Equipment') + '</div>' +
                    '<div class="booking-date">Requested on ' + Utils.formatDate(b.created_at) + '</div>' +
                '</div>' +
                '<div>' + Utils.statusBadge(b.status) + '</div>' +
            '</div>' +

            '<div class="booking-body">' +
                '<div>' +
                    '<div class="booking-section-title">Customer</div>' +
                    '<div class="booking-info-row">' +
                        '<span class="booking-info-label">Name</span>' +
                        '<span class="booking-info-value">' + Utils.escapeHtml(b.customer_name || '-') + '</span>' +
                    '</div>' +
                    '<div class="booking-info-row">' +
                        '<span class="booking-info-label">Email</span>' +
                        '<span class="booking-info-value" style="font-size: 12.5px;">' + Utils.escapeHtml(b.customer_email || '-') + '</span>' +
                    '</div>' +
                    '<div class="booking-info-row">' +
                        '<span class="booking-info-label">Phone</span>' +
                        '<span class="booking-info-value">' + Utils.escapeHtml(b.customer_phone || '-') + '</span>' +
                    '</div>' +
                '</div>' +

                '<div>' +
                    '<div class="booking-section-title">Rental Details</div>' +
                    '<div class="booking-info-row">' +
                        '<span class="booking-info-label">Dates</span>' +
                        '<span class="booking-info-value">' +
                            Utils.formatDate(b.start_date) + ' to ' + Utils.formatDate(b.end_date) +
                        '</span>' +
                    '</div>' +
                    '<div class="booking-info-row">' +
                        '<span class="booking-info-label">Quantity</span>' +
                        '<span class="booking-info-value">' + b.quantity + ' units</span>' +
                    '</div>' +
                    '<div class="booking-info-row">' +
                        '<span class="booking-info-label">Amount</span>' +
                        '<span class="booking-info-value">' + Utils.formatCurrency(b.total_amount) + '</span>' +
                    '</div>' +
                    (b.delivery_address
                        ? '<div class="booking-info-row">' +
                            '<span class="booking-info-label">Delivery to</span>' +
                            '<span class="booking-info-value" style="font-size: 12.5px;">' +
                                Utils.escapeHtml(b.delivery_address) +
                            '</span>' +
                          '</div>'
                        : ''
                    ) +
                    (b.mpesa_receipt
                        ? '<div class="booking-info-row">' +
                            '<span class="booking-info-label">M-Pesa Ref</span>' +
                            '<span class="booking-info-value" style="font-family: monospace; font-size: 12px;">' +
                                Utils.escapeHtml(b.mpesa_receipt) +
                            '</span>' +
                          '</div>'
                        : ''
                    ) +
                '</div>' +
            '</div>' +

            '<div class="booking-actions">' + actions.join('') + '</div>' +
        '</div>';
    }

    function wireActions() {
        document.querySelectorAll('[data-action]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const action = btn.dataset.action;

                if (action === 'chat') {
                    window.location.href = '/owner/chat.html?user=' + btn.dataset.customer;
                    return;
                }

                const bookingId = btn.dataset.booking;
                if (!bookingId) return;

                let message = '';
                if (action === 'confirmed') message = 'Confirm this booking?';
                else if (action === 'cancelled') message = 'Decline this booking? The customer will be notified.';
                else if (action === 'delivered') message = 'Mark this booking as delivered to the customer?';
                else if (action === 'rented') message = 'Mark this booking as currently rented?';
                else if (action === 'returned') message = 'Mark this booking as returned by the customer?';
                else if (action === 'completed') message = 'Mark this rental as completed?';

                if (!confirm(message)) return;

                updateStatus(bookingId, action, btn);
            });
        });
    }

    async function updateStatus(bookingId, status, btn) {
        const restore = UI.buttonLoading(btn, 'Updating...');
        try {
            await Api.updateBookingStatus(bookingId, status);
            UI.toast('Booking status updated to ' + status, 'success');
            await init();
        } catch (err) {
            UI.toast(err.message || 'Failed to update booking', 'error');
            restore();
        }
    }

    document.querySelectorAll('.tab').forEach(function (tab) {
        tab.addEventListener('click', function () {
            document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
            tab.classList.add('active');
            currentFilter = tab.dataset.filter;
            renderBookings();
        });
    });

    document.getElementById('topSearch').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const q = e.target.value.trim().toLowerCase();
            if (!q) return;

            // Filter bookings in-memory
            const container = document.getElementById('bookingList');
            const matches = allBookings.filter(function (b) {
                return (b.booking_ref || '').toLowerCase().indexOf(q) !== -1 ||
                       (b.customer_name || '').toLowerCase().indexOf(q) !== -1 ||
                       (b.equipment_name || '').toLowerCase().indexOf(q) !== -1;
            });

            container.innerHTML = matches.length === 0
                ? '<div class="card"><div class="empty-state"><div class="empty-state-title">No matches</div><div class="empty-state-message">No bookings match your search.</div></div></div>'
                : matches.map(renderBookingItem).join('');

            wireActions();
        }
    });

    init();
</script>

    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
