<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>My Equipment - EventEquip Kenya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .page-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .equipment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .equipment-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }
        .equipment-item:hover {
            border-color: #cbd5e1;
            box-shadow: 0 4px 6px rgba(15, 23, 42, 0.05);
        }
        .equipment-item.unavailable {
            opacity: 0.65;
        }

        .equipment-media {
            position: relative;
            aspect-ratio: 4/3;
            background: #F8FAFC;
            overflow: hidden;
        }
        .equipment-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .equipment-media-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
        }
        .equipment-media-placeholder svg {
            width: 60px;
            height: 60px;
            stroke-width: 1;
        }

        .equipment-badges {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .equipment-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        .equipment-title {
            font-size: 15px;
            font-weight: 700;
            color: #0F172A;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .equipment-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 12px 0;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }
        .equipment-stat {
            text-align: center;
        }
        .equipment-stat-value {
            font-size: 15px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 2px;
        }
        .equipment-stat-label {
            font-size: 10.5px;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .equipment-price {
            font-size: 18px;
            font-weight: 700;
            color: #F97316;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .equipment-price small {
            font-size: 12px;
            color: #64748B;
            font-weight: 500;
        }

        .equipment-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: auto;
        }
        .equipment-actions .btn {
            padding: 8px 10px;
            font-size: 12.5px;
        }
        .equipment-actions .btn-full {
            grid-column: 1 / -1;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }
        .empty-state-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #fed7aa, #fdba74);
            color: #ea580c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .empty-state-icon svg {
            width: 40px;
            height: 40px;
            stroke-width: 2;
        }
        .empty-state-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .empty-state-message {
            font-size: 14px;
            color: #64748B;
            max-width: 400px;
            margin: 0 auto 24px;
            line-height: 1.6;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
        }

        .toggle {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
            flex-shrink: 0;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background: #cbd5e1;
            border-radius: 9999px;
            transition: 0.2s;
        }
        .toggle-slider::before {
            content: '';
            position: absolute;
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: 0.2s;
        }
        .toggle input:checked + .toggle-slider {
            background: #10B981;
        }
        .toggle input:checked + .toggle-slider::before {
            transform: translateX(16px);
        }
        .toggle input:disabled + .toggle-slider {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-backdrop.active {
            display: flex;
        }
        .modal {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 25px rgba(15, 23, 42, 0.15);
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }
        .modal-title {
            font-size: 17px;
            font-weight: 700;
        }
        .modal-close {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748B;
            cursor: pointer;
            background: transparent;
            border: none;
            transition: all 0.15s;
        }
        .modal-close:hover {
            background: #F8FAFC;
            color: #0F172A;
        }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid #e2e8f0;
            background: #F8FAFC;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>

<div class="app-shell">

    <aside class="sidebar"></aside>

    <main class="app-main">

        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search equipment...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" onclick="window.location.href='/owner/chat.html'">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M21 12a8 8 0 11-3.5 6.6L3 21l2.4-6.5A8 8 0 0121 12z"/>
                    </svg>
                    <span class="topbar-icon-badge" id="chatBadge" style="display: none;">0</span>
                </button>
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-content">

            <div class="page-header">
                <div class="page-header-row">
                    <div>
                        <h1 class="page-title">My Equipment</h1>
                        <p class="page-subtitle">Manage your listings, prices, and availability</p>
                    </div>
                    <div class="page-actions">
                        <select class="form-select" id="filterStatus" style="width: auto; padding: 9px 14px;">
                            <option value="">All Equipment</option>
                            <option value="approved">Approved Only</option>
                            <option value="pending">Pending Approval</option>
                            <option value="unavailable">Unavailable</option>
                        </select>
                        <a href="/owner/add-equipment.html" class="btn btn-primary">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
                            </svg>
                            Add Equipment
                        </a>
                    </div>
                </div>
            </div>

            <div id="equipmentContainer">
                <div class="loading-state">
                    <div class="spinner spinner-dark" style="width: 32px; height: 32px; border-width: 3px; display: inline-block;"></div>
                    <p style="margin-top: 16px;">Loading your equipment...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<div class="modal-backdrop" id="editModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">Edit Equipment</div>
            <button class="modal-close" onclick="closeEditModal()">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="editForm">
                <div class="form-group">
                    <label class="form-label">Equipment Name</label>
                    <input type="text" class="form-input" id="editName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea class="form-textarea" id="editDescription" rows="3"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Price per Day (KSh)</label>
                        <input type="number" class="form-input" id="editPrice" required min="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Total Quantity</label>
                        <input type="number" class="form-input" id="editQuantity" required min="1">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="editLocationRegion">Region</label>
                    <select class="form-select" id="editLocationRegion" required>
                        <option value="">Select region</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="editLocationCounty">County</label>
                        <select class="form-select" id="editLocationCounty" required disabled>
                            <option value="">Choose a region first</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="editLocation">Town</label>
                    <select class="form-select" id="editLocation" required>
                            <option value="">Choose a county first</option>
                    </select>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Rental Conditions</label>
                    <textarea class="form-textarea" id="editConditions" rows="3"></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-primary" id="saveEditBtn">Save Changes</button>
        </div>
    </div>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    const user = Auth.requireAuth('owner');
    if (!user) throw new Error('Not authorized');

    Sidebar.render();
    UI.initShell();
    Sidebar.updateUnreadBadge();

    let allEquipment = [];
    let currentFilter = '';
    let editingId = null;
    let editLocationCatalog = [];

    async function loadLocations() {
        const regionSelect = document.getElementById('editLocationRegion');
        try {
            const data = await Api.getLocations();
            editLocationCatalog = data.locations || [];
            Array.from(new Set(editLocationCatalog.map(function (item) { return item.region; }))).sort().forEach(function (region) {
                regionSelect.add(new Option(region, region));
            });
            regionSelect.addEventListener('change', function () { refreshEditCounties(''); });
            document.getElementById('editLocationCounty').addEventListener('change', function () { refreshEditTowns(''); });
        } catch (err) {
            console.error('Failed to load locations:', err);
        }
    }

    function refreshEditCounties(selectedCounty) {
        const region = document.getElementById('editLocationRegion').value;
        const countySelect = document.getElementById('editLocationCounty');
        countySelect.replaceChildren(new Option(region ? 'Select county' : 'Choose a region first', ''));
        Array.from(new Set(editLocationCatalog.filter(function (item) {
            return item.region === region;
        }).map(function (item) { return item.county; }))).sort().forEach(function (county) {
            countySelect.add(new Option(county, county));
        });
        countySelect.disabled = !region;
        countySelect.value = selectedCounty || '';
        refreshEditTowns('');
    }

    function refreshEditTowns(selectedTown) {
        const region = document.getElementById('editLocationRegion').value;
        const county = document.getElementById('editLocationCounty').value;
        const townSelect = document.getElementById('editLocation');
        townSelect.replaceChildren(new Option(county ? 'Select town' : 'Choose a county first', ''));
        editLocationCatalog.filter(function (item) {
            return item.region === region && item.county === county;
        }).sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (item) {
            townSelect.add(new Option(item.name, item.name));
        });
        townSelect.disabled = !county;
        townSelect.value = selectedTown || '';
    }

    async function init() {
        try {
            await loadLocations();
            const data = await Api.getMyEquipment();
            allEquipment = data.equipment || [];
            renderEquipment();

            try {
                const unread = await Api.getUnreadCount();
                if (unread.unread > 0) {
                    const badge = document.getElementById('chatBadge');
                    badge.textContent = unread.unread;
                    badge.style.display = 'flex';
                }
            } catch (e) { /* silent */ }

        } catch (err) {
            console.error('Failed to load equipment:', err);
            document.getElementById('equipmentContainer').innerHTML =
                '<div class="alert alert-danger">Failed to load equipment: ' +
                Utils.escapeHtml(err.message) + '</div>';
        }
    }

    function renderEquipment() {
        const container = document.getElementById('equipmentContainer');
        let filtered = allEquipment;

        if (currentFilter === 'approved') {
            filtered = allEquipment.filter(function (e) { return e.is_approved; });
        } else if (currentFilter === 'pending') {
            filtered = allEquipment.filter(function (e) { return !e.is_approved; });
        } else if (currentFilter === 'unavailable') {
            filtered = allEquipment.filter(function (e) { return !e.is_available; });
        }

        if (filtered.length === 0) {
            container.innerHTML = renderEmptyState();
            return;
        }

        container.innerHTML = '<div class="equipment-grid">' +
            filtered.map(renderEquipmentItem).join('') +
        '</div>';

        wireActions();
    }

    function renderEmptyState() {
        if (allEquipment.length === 0) {
            return '<div class="empty-state">' +
                '<div class="empty-state-icon">' +
                    '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                        '<path d="M3 7l9-4 9 4-9 4-9-4z"/>' +
                        '<path d="M3 12l9 4 9-4M3 17l9 4 9-4"/>' +
                    '</svg>' +
                '</div>' +
                '<div class="empty-state-title">No equipment listed yet</div>' +
                '<div class="empty-state-message">Add your first equipment listing to start receiving rental requests.</div>' +
                '<a href="/owner/add-equipment.html" class="btn btn-primary">Add Equipment</a>' +
            '</div>';
        }

        return '<div class="empty-state">' +
            '<div class="empty-state-title">No equipment matches this filter</div>' +
            '<div class="empty-state-message">Try a different filter to see your listings.</div>' +
        '</div>';
    }

    function renderEquipmentItem(e) {
        const imageUrl = Utils.imageUrl(e.primary_image || '');
        const imageHtml = imageUrl
            ? '<img src="' + Utils.escapeHtml(imageUrl) + '" alt="" onerror="this.parentElement.innerHTML=\'\'">'
            : '<div class="equipment-media-placeholder">' +
                '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">' +
                    '<path stroke-linecap="round" stroke-linejoin="round" d="M12 3l9 7-2 11H5L3 10l9-7z"/>' +
                '</svg>' +
              '</div>';

        let approvalBadge = '';
        if (e.is_approved) {
            approvalBadge = '<span class="badge badge-success">Approved</span>';
        } else {
            approvalBadge = '<span class="badge badge-warning">Pending Review</span>';
        }

        let availBadge = '';
        if (!e.is_available) {
            availBadge = '<span class="badge badge-gray">Unavailable</span>';
        }

        return '<div class="equipment-item' + (!e.is_available ? ' unavailable' : '') + '">' +
            '<div class="equipment-media">' +
                imageHtml +
                '<div class="equipment-badges">' +
                    '<div>' + approvalBadge + '</div>' +
                    '<div>' + availBadge + '</div>' +
                '</div>' +
            '</div>' +

            '<div class="equipment-body">' +
                '<div>' +
                    '<div style="font-size: 11px; color: #F97316; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px;">' +
                        Utils.escapeHtml(e.category_name || '') +
                    '</div>' +
                    '<div class="equipment-title">' + Utils.escapeHtml(e.name) + '</div>' +
                '</div>' +

                '<div class="equipment-price">' +
                    Utils.formatCurrency(e.price_per_day) +
                    '<small>per day</small>' +
                '</div>' +

                '<div class="equipment-stats">' +
                    '<div class="equipment-stat">' +
                        '<div class="equipment-stat-value" data-stat="total">' + e.quantity_total + '</div>' +
                        '<div class="equipment-stat-label">Total</div>' +
                    '</div>' +
                    '<div class="equipment-stat">' +
                        '<div class="equipment-stat-value" style="color: #10B981;" data-stat="available">' + e.quantity_available + '</div>' +
                        '<div class="equipment-stat-label">Available</div>' +
                    '</div>' +
                    '<div class="equipment-stat">' +
                        '<div class="equipment-stat-value" data-stat="bookings">' + (e.total_bookings || 0) + '</div>' +
                        '<div class="equipment-stat-label">Bookings</div>' +
                    '</div>' +
                '</div>' +

                '<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0;">' +
                    '<span style="font-size: 12.5px; color: #64748B; font-weight: 500;">Available for rent</span>' +
                    '<label class="toggle">' +
                        '<input type="checkbox" ' + (e.is_available ? 'checked' : '') +
                            ' data-action="toggle" data-equipment="' + e.equipment_id + '">' +
                        '<span class="toggle-slider"></span>' +
                    '</label>' +
                '</div>' +

                '<div class="equipment-actions">' +
                    '<button class="btn btn-outline btn-sm" data-action="edit" data-equipment="' + e.equipment_id + '">' +
                        'Edit' +
                    '</button>' +
                    '<button class="btn btn-outline btn-sm" data-action="view" data-equipment="' + e.equipment_id + '">' +
                        'View' +
                    '</button>' +
                    '<button class="btn btn-ghost btn-sm btn-full" data-action="delete" data-equipment="' + e.equipment_id + '" style="color: #dc2626;">' +
                        'Delete Listing' +
                    '</button>' +
                '</div>' +
            '</div>' +
        '</div>';
    }

    function wireActions() {
        document.querySelectorAll('[data-action]').forEach(function (el) {
            if (el.dataset.action === 'toggle') {
                el.addEventListener('change', function () {
                    toggleAvailability(el.dataset.equipment, el.checked, el);
                });
            } else {
                el.addEventListener('click', function (evt) {
                    evt.preventDefault();
                    const action = el.dataset.action;
                    const id = el.dataset.equipment;

                    if (action === 'edit') openEditModal(id);
                    else if (action === 'view') window.open('/customer/equipment.html?id=' + id, '_blank');
                    else if (action === 'delete') deleteEquipment(id);
                });
            }
        });
    }

    async function toggleAvailability(id, isAvailable, checkbox) {
        checkbox.disabled = true;
        try {
            const result = await Api.updateEquipment(id, { is_available: isAvailable });
            UI.toast('Availability ' + (isAvailable ? 'enabled' : 'disabled'), 'success');

            const item = allEquipment.find(function (e) { return e.equipment_id === Number(id); });
            if (item) {
                item.is_available = isAvailable ? 1 : 0;
                if (result && result.equipment) {
                    Object.assign(item, result.equipment);
                }
            }
            renderEquipment();
        } catch (err) {
            UI.toast(err.message || 'Failed to update availability', 'error');
            checkbox.disabled = false;
            checkbox.checked = !isAvailable;
        }
    }

    function openEditModal(id) {
        const item = allEquipment.find(function (e) { return e.equipment_id === Number(id); });
        if (!item) return;

        editingId = id;

        document.getElementById('editName').value = item.name || '';
        document.getElementById('editDescription').value = item.description || '';
        document.getElementById('editPrice').value = item.price_per_day || '';
        document.getElementById('editQuantity').value = item.quantity_total || '';
        const locationRecord = editLocationCatalog.find(function (location) { return location.name === item.location; });
        if (locationRecord) {
            document.getElementById('editLocationRegion').value = locationRecord.region;
            refreshEditCounties(locationRecord.county);
            refreshEditTowns(locationRecord.name);
        } else if (item.location) {
            document.getElementById('editLocationRegion').value = '';
            refreshEditCounties('');
            const locationSelect = document.getElementById('editLocation');
            const legacyOption = document.createElement('option');
            legacyOption.value = item.location;
            legacyOption.textContent = item.location + ' (current listing location)';
            locationSelect.appendChild(legacyOption);
            locationSelect.disabled = false;
            locationSelect.value = item.location;
        }
        document.getElementById('editConditions').value = item.rental_conditions || '';

        // Reset the save button state
        const btn = document.getElementById('saveEditBtn');
        btn.disabled = false;
        btn.classList.remove('loading');
        btn.innerHTML = 'Save Changes';

        document.getElementById('editModal').classList.add('active');
        document.getElementById('saveEditBtn').onclick = saveEdit;
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
        editingId = null;
    }

    async function saveEdit() {
        if (!editingId) return;

        const payload = {
            name: document.getElementById('editName').value.trim(),
            description: document.getElementById('editDescription').value.trim(),
            price_per_day: Number(document.getElementById('editPrice').value),
            quantity_total: Number(document.getElementById('editQuantity').value),
            location: document.getElementById('editLocation').value.trim(),
            rental_conditions: document.getElementById('editConditions').value.trim()
        };

        if (!payload.name || !payload.price_per_day || !payload.quantity_total || !payload.location) {
            UI.toast('Please fill all required fields', 'warning');
            return;
        }

        const btn = document.getElementById('saveEditBtn');
        const restore = UI.buttonLoading(btn, 'Saving...');

        try {
            const result = await Api.updateEquipment(editingId, payload);

            // Update local state
            const index = allEquipment.findIndex(function (e) {
                return e.equipment_id === Number(editingId);
            });

            if (index !== -1) {
                Object.assign(allEquipment[index], payload);
                if (result && result.equipment) {
                    Object.assign(allEquipment[index], result.equipment);
                }
            }

            restore();
            closeEditModal();
            renderEquipment();
            UI.toast('Equipment updated', 'success');

        } catch (err) {
            console.error('Save error:', err);
            UI.toast(err.message || 'Failed to save changes', 'error');
            restore();
        }
    }

    async function deleteEquipment(id) {
        const item = allEquipment.find(function (e) { return e.equipment_id === Number(id); });
        if (!item) return;

        if (!confirm('Delete "' + item.name + '"? This action cannot be undone.')) return;

        try {
            await Api.deleteEquipment(id);
            UI.toast('Equipment deleted', 'success');
            await init();
        } catch (err) {
            UI.toast(err.message || 'Failed to delete equipment', 'error');
        }
    }

    document.getElementById('filterStatus').addEventListener('change', function (e) {
        currentFilter = e.target.value;
        renderEquipment();
    });

    document.getElementById('topSearch').addEventListener('input', function (e) {
        const q = e.target.value.trim().toLowerCase();
        if (!q) {
            renderEquipment();
            return;
        }

        const filtered = allEquipment.filter(function (item) {
            return (item.name || '').toLowerCase().indexOf(q) !== -1 ||
                   (item.category_name || '').toLowerCase().indexOf(q) !== -1 ||
                   (item.location || '').toLowerCase().indexOf(q) !== -1;
        });

        const container = document.getElementById('equipmentContainer');
        if (filtered.length === 0) {
            container.innerHTML = '<div class="empty-state">' +
                '<div class="empty-state-title">No matches</div>' +
                '<div class="empty-state-message">No equipment matches "' + Utils.escapeHtml(e.target.value) + '".</div>' +
            '</div>';
        } else {
            container.innerHTML = '<div class="equipment-grid">' +
                filtered.map(renderEquipmentItem).join('') +
            '</div>';
            wireActions();
        }
    });

    document.getElementById('editModal').addEventListener('click', function (e) {
        if (e.target === this) closeEditModal();
    });

    init();
</script>

    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
