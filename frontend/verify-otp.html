<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Verify Reset Code - EventEquip Kenya</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; }
        .auth-card { width: min(100%, 460px); padding: 36px; border: 1px solid #e2e8f0; border-radius: 16px; background: #fff; box-shadow: 0 18px 45px rgba(15,23,42,.08); }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; color: #0f172a; font-weight: 800; text-decoration: none; }
        .brand img { width: 44px; height: 44px; border-radius: 10px; }
        .brand small { display: block; color: #64748b; font-size: 9px; letter-spacing: .16em; }
        h1 { margin: 0 0 8px; font-size: 24px; }
        .subtitle { margin: 0 0 24px; color: #64748b; font-size: 14px; line-height: 1.6; }
        .form-group { margin-bottom: 18px; }
        .otp-input { letter-spacing: .35em; font-size: 20px; font-weight: 700; }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>
    <main class="auth-card">
        <a href="/" class="brand"><img src="/assets/images/icons/Icon.png" alt=""><span>EventEquip<small>KENYA</small></span></a>
        <h1>Verify your phone</h1>
        <p class="subtitle">Enter the six-digit code to continue. The code expires after 10 minutes and allows five attempts.</p>
        <div class="alert" id="verifyStatus" style="display:none; margin-bottom:18px"></div>
        <form id="verifyForm" novalidate>
            <div class="form-group">
                <label class="form-label" for="phone">Phone number</label>
                <input class="form-input" id="phone" type="tel" autocomplete="tel" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="otp">Six-digit verification code</label>
                <input class="form-input otp-input" id="otp" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
            </div>
            <button class="btn btn-primary btn-block" id="verifyBtn" type="submit">Verify code</button>
        </form>
        <div style="margin-top:22px; text-align:center; font-size:13px"><a href="/forgot-password.html">Request a new code</a></div>
    </main>
    <script src="/assets/js/config.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/ui.js"></script>
    <script>
        const phoneInput = document.getElementById('phone');
        phoneInput.value = sessionStorage.getItem('eventequip_reset_phone') || '';
        const statusBox = document.getElementById('verifyStatus');
        function showStatus(message, type) {
            statusBox.className = 'alert alert-' + type;
            statusBox.textContent = message;
            statusBox.style.display = 'flex';
        }
        document.getElementById('verifyForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            const phone = phoneInput.value.trim();
            const otp = document.getElementById('otp').value.trim();
            if (!/^0?[17]\d{8}$/.test(phone.replace(/\D/g, '')) && !/^254[17]\d{8}$/.test(phone.replace(/\D/g, ''))) return showStatus('Enter the phone number for your account.', 'danger');
            if (!/^\d{6}$/.test(otp)) return showStatus('Enter the six-digit code.', 'danger');
            const button = document.getElementById('verifyBtn');
            const restore = UI.buttonLoading(button, 'Verifying...');
            try {
                await Api.verifyPasswordResetCode(phone, otp);
                sessionStorage.setItem('eventequip_reset_phone', phone);
                sessionStorage.setItem('eventequip_reset_otp', otp);
                window.location.href = '/reset-password.html';
            } catch (err) {
                showStatus(err.message || 'The code is invalid or expired. Request a new code and try again.', 'danger');
            } finally {
                restore();
            }
        });
    </script>
    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
