<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Owner Verification - EventEquip Kenya Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/pages.css">
    <style>
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-box {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
        }
        .stat-box-label {
            font-size: 12.5px;
            color: #64748B;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }
        .stat-box-value {
            font-size: 28px;
            font-weight: 800;
            color: #0F172A;
            line-height: 1;
        }

        .filter-bar {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .filter-bar .form-input {
            flex: 1;
            min-width: 200px;
            padding: 9px 14px;
        }

        .owner-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .owner-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #1E3A8A;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .owner-info {
            flex: 1;
            min-width: 0;
        }
        .owner-name {
            font-size: 13.5px;
            font-weight: 600;
            color: #0F172A;
            margin-bottom: 2px;
        }
        .owner-email {
            font-size: 11.5px;
            color: #64748B;
        }
        .owner-business {
            font-size: 12.5px;
            color: #0F172A;
            font-weight: 600;
            margin-bottom: 2px;
        }
        .owner-id-number {
            font-size: 11.5px;
            color: #64748B;
            font-family: 'SF Mono', Menlo, monospace;
        }

        .loading-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748B;
        }

        .tabs {
            display: flex;
            gap: 4px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 24px;
        }
        .tab {
            padding: 12px 20px;
            font-size: 13.5px;
            font-weight: 600;
            color: #64748B;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border-top: none;
            border-left: none;
            border-right: none;
            font-family: inherit;
        }
        .tab:hover { color: #0F172A; }
        .tab.active {
            color: #F97316;
            border-bottom-color: #F97316;
        }
        .tab-count {
            padding: 1px 8px;
            background: #F1F5F9;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
        }
        .tab.active .tab-count {
            background: #fed7aa;
            color: #ea580c;
        }

        .action-buttons {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        @media (max-width: 768px) {
            .stats-row {
                grid-template-columns: 1fr;
            }
            .action-buttons {
                flex-direction: column;
            }
            .action-buttons .btn {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar"></aside>

    <main class="app-main">
        <div class="topbar">
            <div class="topbar-left">
                <button class="topbar-toggle" onclick="UI.toggleSidebar()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>
                <div class="topbar-search">
                    <svg class="topbar-search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="7"/>
                        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
                    </svg>
                    <input type="text" id="topSearch" placeholder="Search owners...">
                </div>
            </div>
            <div class="topbar-right">
                <button class="topbar-icon-btn" data-action="logout" title="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                </button>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" data-user="initials">?</div>
                    <div class="topbar-user-meta">
                        <div class="topbar-user-name" data-user="name">Loading...</div>
                        <div class="topbar-user-role" data-user="role"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="app-content">
            <div class="page-header">
                <h1 class="page-title">Owner Verification</h1>
                <p class="page-subtitle">Review and verify event rental business owners before they can list equipment</p>
            </div>

            <div class="stats-row">
                <div class="stat-box">
                    <div class="stat-box-label">Pending Review</div>
                    <div class="stat-box-value" id="statPending" style="color: #F59E0B;">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-box-label">Approved</div>
                    <div class="stat-box-value" id="statApproved" style="color: #10B981;">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-box-label">Rejected</div>
                    <div class="stat-box-value" id="statRejected" style="color: #EF4444;">0</div>
                </div>
            </div>

            <div class="filter-bar">
                <input type="text" class="form-input" id="searchInput" placeholder="Search by owner name, business, email or ID number...">
            </div>

            <div id="ownersTable">
                <div class="loading-state">
                    <div class="spinner spinner-dark" style="width: 32px; height: 32px; border-width: 3px; display: inline-block;"></div>
                    <p style="margin-top: 16px;">Loading pending owners...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<div class="sidebar-overlay" onclick="UI.toggleSidebar()"></div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/utils.js"></script>
<script src="/assets/js/api.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/sidebar.js"></script>
<script>
    const user = Auth.requireAuth('admin');
    if (!user) throw new Error('Not authorized');

    Sidebar.render();
    UI.initShell();

    let pendingOwners = [];
    let allOwners = [];
    let searchQuery = '';

    async function init() {
        try {
            // Load all users (to compute approved/rejected counts) and pending owners
            const [allUsersData, pendingData] = await Promise.all([
                Api.adminUsers('owner'),
                Api.adminPendingOwners()
            ]);

            allOwners = allUsersData.users || [];
            pendingOwners = pendingData.owners || [];

            // Compute stats
            const approved = allOwners.filter(function (o) {
                return o.owner_verified === 1;
            }).length;

            const total = allOwners.length;
            const pending = pendingOwners.length;
            const rejected = total - approved - pending;

            document.getElementById('statPending').textContent = pending;
            document.getElementById('statApproved').textContent = approved;
            document.getElementById('statRejected').textContent = Math.max(0, rejected);

            renderOwners();

        } catch (err) {
            console.error('Failed to load owners:', err);
            document.getElementById('ownersTable').innerHTML =
                '<div class="alert alert-danger">Failed to load owners: ' +
                Utils.escapeHtml(err.message) + '</div>';
        }
    }

    function renderOwners() {
        const container = document.getElementById('ownersTable');
        let filtered = pendingOwners;

        if (searchQuery) {
            const q = searchQuery.toLowerCase();
            filtered = filtered.filter(function (o) {
                return (o.full_name || '').toLowerCase().indexOf(q) !== -1 ||
                       (o.email || '').toLowerCase().indexOf(q) !== -1 ||
                       (o.phone || '').toLowerCase().indexOf(q) !== -1 ||
                       (o.business_name || '').toLowerCase().indexOf(q) !== -1 ||
                       (o.id_number || '').toLowerCase().indexOf(q) !== -1;
            });
        }

        if (filtered.length === 0) {
            container.innerHTML = '<div class="card">' +
                '<div class="empty-state">' +
                    '<div class="empty-state-title">' +
                        (pendingOwners.length === 0 ? 'No pending verifications' : 'No owners match your search') +
                    '</div>' +
                    '<div class="empty-state-message">' +
                        (pendingOwners.length === 0
                            ? 'All owner applications have been reviewed. New applications will appear here.'
                            : 'Try a different search term.') +
                    '</div>' +
                '</div>' +
            '</div>';
            return;
        }

        const rows = filtered.map(renderOwnerRow).join('');

        container.innerHTML =
            '<div class="table-wrapper">' +
                '<table class="table">' +
                    '<thead>' +
                        '<tr>' +
                            '<th>Owner</th>' +
                            '<th>Business</th>' +
                            '<th>Contact</th>' +
                            '<th>ID Number</th>' +
                            '<th>Applied</th>' +
                            '<th style="text-align: right;">Actions</th>' +
                        '</tr>' +
                    '</thead>' +
                    '<tbody>' + rows + '</tbody>' +
                '</table>' +
            '</div>';

        wireActions();
    }

    function renderOwnerRow(o) {
        const initials = Utils.initials(o.full_name);

        return '<tr>' +
            '<td>' +
                '<div class="owner-cell">' +
                    '<div class="owner-avatar">' + Utils.escapeHtml(initials) + '</div>' +
                    '<div class="owner-info">' +
                        '<div class="owner-name">' + Utils.escapeHtml(o.full_name) + '</div>' +
                        '<div class="owner-email">' + Utils.escapeHtml(o.email) + '</div>' +
                    '</div>' +
                '</div>' +
            '</td>' +
            '<td>' +
                '<div class="owner-business">' + Utils.escapeHtml(o.business_name || '-') + '</div>' +
            '</td>' +
            '<td>' +
                '<div style="font-size: 13px;">' + Utils.escapeHtml(o.phone || '-') + '</div>' +
                '<div style="font-size: 11.5px; color: #64748B; margin-top: 2px;">M-Pesa: ' +
                    Utils.escapeHtml(o.mpesa_number || '-') +
                '</div>' +
            '</td>' +
            '<td>' +
                '<div class="owner-id-number">' + Utils.escapeHtml(o.id_number || '-') + '</div>' +
            '</td>' +
            '<td>' + Utils.formatDate(o.created_at) + '</td>' +
            '<td>' +
                '<div class="action-buttons">' +
                    '<button class="btn btn-success btn-sm" data-action="approve" data-owner="' + o.owner_id + '">' +
                        'Approve' +
                    '</button>' +
                    '<button class="btn btn-danger btn-sm" data-action="reject" data-owner="' + o.owner_id + '">' +
                        'Reject' +
                    '</button>' +
                '</div>' +
            '</td>' +
        '</tr>';
    }

    function wireActions() {
        document.querySelectorAll('[data-action="approve"]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                verifyOwner(this.dataset.owner, true, this);
            });
        });

        document.querySelectorAll('[data-action="reject"]').forEach(function (btn) {
            btn.addEventListener('click', function () {
                verifyOwner(this.dataset.owner, false, this);
            });
        });
    }

    async function verifyOwner(ownerId, approve, btn) {
        const action = approve ? 'approve' : 'reject';
        if (!confirm('Are you sure you want to ' + action + ' this owner?')) return;

        const restore = UI.buttonLoading(btn, 'Processing...');

        try {
            await Api.adminVerifyOwner(ownerId, approve);
            UI.toast('Owner ' + (approve ? 'approved' : 'rejected'), 'success');

            // Reload everything to update stats
            await init();

        } catch (err) {
            UI.toast(err.message || 'Failed to verify owner', 'error');
            restore();
        }
    }

    document.getElementById('searchInput').addEventListener('input', function (e) {
        searchQuery = e.target.value.trim();
        renderOwners();
    });

    document.getElementById('topSearch').addEventListener('input', function (e) {
        searchQuery = e.target.value.trim();
        document.getElementById('searchInput').value = e.target.value;
        renderOwners();
    });

    init();
</script>

    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
