<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/icons/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/assets/images/icons/favicon.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/assets/images/icons/favicon.png">
    <meta name="theme-color" content="#1E3A8A">
    <title>Page Not Found - EventEquip Kenya</title>
    <link rel="stylesheet" href="/assets/css/base.css">
    <style>
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; }
        .not-found { width: min(100%, 520px); padding: 44px 36px; border: 1px solid #e2e8f0; border-radius: 18px; background: #fff; text-align: center; box-shadow: 0 20px 45px rgba(15, 23, 42, .08); }
        .brand { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 34px; color: #0f172a; text-align: left; text-decoration: none; font-weight: 800; }
        .brand img { width: 46px; height: 46px; border-radius: 11px; }
        .brand small { display: block; margin-top: 2px; color: #64748b; font-size: 9px; letter-spacing: .18em; }
        .code { color: #f97316; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 10px 0; color: #0f172a; font-size: clamp(26px, 6vw, 36px); }
        p { margin: 0 auto 24px; max-width: 390px; color: #64748b; line-height: 1.6; }
        .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; }
    </style>
    <link rel="stylesheet" href="/assets/css/polish.css">
</head>
<body>
    <main class="not-found">
        <a class="brand" href="/">
            <img src="/assets/images/icons/Icon.png" alt="">
            <span>EventEquip<small>KENYA</small></span>
        </a>
        <div class="code">404 · Page not found</div>
        <h1>We can’t find that page</h1>
        <p>The page may have moved or the address may be incorrect. Browse the available equipment or return to the homepage.</p>
        <div class="actions">
            <a class="btn btn-primary" href="/customer/browse.html">Browse equipment</a>
            <a class="btn btn-outline" href="/">Back to home</a>
        </div>
    </main>
    <script defer src="/assets/js/motion.js"></script>
</body>
</html>
